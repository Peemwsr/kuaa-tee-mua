# (ไม่บังคับ) ยิงฐานข้อมูลเบาๆ ทุก 3 วัน เพื่อลดโอกาสที่โปรเจกต์ Supabase แผนฟรีถูกพักเพราะไม่มีคนใช้งาน
# ตั้งค่า: GitHub repo > Settings > Secrets and variables > Actions > New repository secret
#   SUPABASE_URL  = Project URL      SUPABASE_KEY = anon/publishable key
name: keepalive
on:
  schedule:
    - cron: "17 3 */3 * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: ping database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          curl -sS -m 30 -X POST "$SUPABASE_URL/rest/v1/rpc/kuaa_check_admin" \
            -H "apikey: $SUPABASE_KEY" -H "Content-Type: application/json" \
            -d '{"p_code":"keepalive","p_admin_key":"keepalive"}'
