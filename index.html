<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>ก๊วนตีมั่ว — ลงชื่อ จับคู่ คิดเงิน</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&family=Prompt:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ffffff; --surface:#ffffff; --surface2:#f7f4fc; --ink:#2b2140; --muted:#6c6086; --line:#e9dcf0;
  --brand:#e11d74; --brand2:#0e6af0; --brand-ink:#ffffff; --brand-soft:#ffe3f0; --brand-text:#c4125f; --lime:#ffd93d; --lime-ink:#4a3500;
  --hero1:#e11d74; --hero2:#0e6af0; --hero-ink:#ffffff; --hero-pill:rgba(255,255,255,.22);
  --court:#e7f1ff; --courtline:#8fb8f5;
  --ta:#0e6af0; --ta-soft:#dcebff; --tb:#e11d74; --tb-soft:#ffdcec;
  --danger:#d92d20; --danger-soft:#ffe8e5; --danger-ink:#ffffff; --ok:#0f8a6a;
  --shadow:0 2px 4px rgba(110,60,150,.08),0 10px 26px rgba(70,60,160,.14);
  color-scheme: light;
  box-sizing:border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
html{scroll-padding-top: env(safe-area-inset-top, 0px);}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);background-image:radial-gradient(540px 320px at 0% 0%,rgba(255,120,180,.20),transparent 70%),radial-gradient(580px 340px at 100% 0%,rgba(90,160,255,.24),transparent 70%);background-repeat:no-repeat;background-attachment:fixed;color:var(--ink);font-family:"Noto Sans Thai","Sarabun",Tahoma,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
.app{max-width:720px;margin:0 auto;padding:14px 14px 112px}
h1,h2,h3{font-family:"Prompt","Noto Sans Thai",Tahoma,sans-serif;margin:0}
h2{font-size:17px;font-weight:600}
.card h2::before{content:"";display:inline-block;width:5px;height:16px;border-radius:3px;margin-right:8px;vertical-align:-2px;background:linear-gradient(180deg,var(--brand),var(--brand2))}

/* hero */
.hero{background:repeating-linear-gradient(135deg,rgba(255,255,255,.09) 0 12px,transparent 12px 24px),linear-gradient(135deg,var(--hero1),var(--hero2));color:var(--hero-ink);border-radius:20px;padding:16px 16px 14px;margin-bottom:12px;box-shadow:var(--shadow)}
.hero h1{font-size:23px;font-weight:700;line-height:1.3}
.hero .sub{opacity:.9;font-size:13.5px;margin-top:2px}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.pills span{background:var(--hero-pill);border-radius:99px;padding:3px 11px;font-size:13px;font-weight:600}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:var(--shadow);margin-bottom:12px}
.card h2{margin-bottom:10px}
.rowhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.rowhead h2{margin:0}
.hint{color:var(--muted);font-size:13px;margin:8px 0 0}
.empty{text-align:center;padding:22px 10px;color:var(--muted)}
.empty .big{font-size:34px}

/* inputs */
.in{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface2);color:var(--ink);font-size:16px;min-width:0}
.in:focus{outline:2px solid var(--brand-text);outline-offset:1px}
select.in{padding-right:6px}
.fl{display:block;font-size:13px;color:var(--muted);margin-bottom:10px}
.fl .in{margin-top:4px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
textarea.in{resize:vertical}
.addrow{display:grid;grid-template-columns:1fr 78px auto;gap:8px}
.lv{width:auto;min-width:64px;text-align:center}

/* buttons */
.btn{background:linear-gradient(135deg,var(--brand),var(--brand2));color:var(--brand-ink);border:0;border-radius:12px;padding:10px 16px;font-weight:600;cursor:pointer;font-size:15px}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:var(--brand-soft);color:var(--brand-text)}
.btn.danger{background:var(--danger-soft);color:var(--danger)}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:9px}
.btn.big{padding:14px 18px;font-size:17px;width:100%;font-family:"Prompt","Noto Sans Thai",sans-serif;box-shadow:0 6px 16px rgba(225,29,116,.32);letter-spacing:.2px}
.btn.ask{background:var(--danger);color:var(--danger-ink)}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.btnrow .btn{flex:1 1 auto}
.x{border:0;background:transparent;color:var(--muted);font-size:16px;cursor:pointer;border-radius:8px;padding:6px 8px;min-width:36px}
.x.ask{background:var(--danger);color:var(--danger-ink);font-size:13px;font-weight:600}

/* players */
.prow{display:grid;grid-template-columns:auto 1fr auto auto;gap:8px;align-items:start;padding:9px 0;border-top:1px solid var(--line)}
.prow:first-of-type{border-top:0}
.prow.off .nm{opacity:.55}
.chk{width:24px;height:24px;margin:8px 2px 0 0;accent-color:var(--brand-text)}
.prow .lv{margin-top:0}
.nm{font-weight:600}
.pmeta{display:flex;align-items:center;gap:8px;margin-top:4px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.pill{border:1px solid var(--line);background:var(--surface2);border-radius:99px;padding:1px 10px;font-size:12.5px;cursor:pointer}
.pill.on{background:var(--lime);border-color:var(--lime);color:var(--lime-ink);font-weight:600}
details.bulkd{margin-top:10px}
details.bulkd summary{cursor:pointer;color:var(--brand-text);font-weight:600;font-size:14px;padding:4px 0}
details.bulkd textarea{margin:8px 0}

/* courts & costs */
.crow,.erow{border:1px solid var(--line);border-radius:14px;padding:10px;margin-bottom:10px;background:var(--surface2)}
.crowtop{display:grid;grid-template-columns:1fr auto;gap:6px;align-items:center;margin-bottom:8px}
.crow .two{margin-bottom:0}
.sum{font-family:"Prompt","Noto Sans Thai",sans-serif;font-weight:600;color:var(--ok);padding:8px 2px}
.sum small{color:var(--muted);font-weight:400;font-family:"Noto Sans Thai",sans-serif}
.grid3b{display:grid;grid-template-columns:1fr 1fr auto;gap:10px;align-items:end}
.total{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:15px}
.total .t{font-family:"Prompt","Noto Sans Thai",sans-serif;font-weight:600;text-align:right}
.total .grand{font-size:18px;border-top:1px dashed var(--line);padding-top:8px;margin-top:4px}

/* match */
.togs{display:flex;flex-wrap:wrap;gap:8px}
.tog{border:1.5px solid var(--line);background:var(--surface2);border-radius:99px;padding:6px 14px;cursor:pointer;font-weight:500}
.tog.on{background:var(--brand);border-color:var(--brand);color:var(--brand-ink);font-weight:600}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:4px}
.seg button{border:0;background:transparent;border-radius:9px;padding:8px 6px;cursor:pointer;font-weight:500;font-size:14px}
.seg button.on{background:var(--brand);color:var(--brand-ink);font-weight:600}
.info{background:var(--brand-soft);border-radius:12px;padding:9px 12px;font-size:13.5px;margin:10px 0}
.match{border:2px solid var(--brand2);border-radius:16px;overflow:hidden;margin-bottom:12px;background:var(--surface)}
.mhead{display:flex;justify-content:space-between;align-items:center;background:linear-gradient(90deg,var(--brand),var(--brand2));color:var(--brand-ink);padding:8px 14px;font-family:"Prompt","Noto Sans Thai",sans-serif;font-weight:600}
.mhead span{font-weight:500;font-size:13px;opacity:.9}
.mbody{display:grid;grid-template-columns:1fr 46px 1fr;background:var(--court)}
.team{padding:10px;display:flex;flex-direction:column;gap:8px;justify-content:center}
.vs{display:flex;align-items:center;justify-content:center;font:700 13px "Prompt",sans-serif;color:var(--brand-text);border-left:2px dashed var(--courtline);border-right:2px dashed var(--courtline);margin:8px 0}
.chip{display:flex;align-items:center;justify-content:space-between;gap:6px;width:100%;padding:10px 10px;border-radius:11px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font-weight:600;font-size:15px;line-height:1.2;text-align:left}
button.chip{cursor:pointer}
.chip i{font-style:normal;font-size:11px;font-weight:500;color:var(--muted);background:var(--surface);border:1px solid var(--line);padding:1px 7px;border-radius:99px;white-space:nowrap}
.team.ta .chip{background:var(--ta-soft);border-color:var(--ta)}
.team.tb .chip{background:var(--tb-soft);border-color:var(--tb)}
.chip.sel{box-shadow:0 0 0 3px var(--lime),0 0 0 5px var(--ink);transform:scale(1.03)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips .chip{width:auto}
.bench{margin-top:4px}
.lbl{font-size:13px;color:var(--muted);margin:2px 0 8px;font-weight:500}
.rtitle{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;gap:8px;flex-wrap:wrap}
.tag{font-size:12px;border-radius:99px;padding:2px 10px;background:var(--lime);color:var(--lime-ink);font-weight:600}
.tag.done{background:var(--surface2);color:var(--muted);border:1px solid var(--line)}
.hist{border-top:1px solid var(--line);padding:8px 0;font-size:13.5px}
.hist b{font-family:"Prompt",sans-serif}
.hist div{color:var(--muted)}
.gstat{display:flex;flex-wrap:wrap;gap:6px}
.gstat span{background:var(--surface2);border:1px solid var(--line);border-radius:99px;padding:2px 10px;font-size:13px}
.gstat b{color:var(--brand-text)}

/* money */
.radio{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line);cursor:pointer}
.radio:first-of-type{border-top:0}
.radio input{margin-top:5px;accent-color:var(--brand-text);width:18px;height:18px}
.radio small{display:block;color:var(--muted);font-size:12.5px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.kpi small{color:var(--muted);display:block;font-size:12.5px}
.kpi b{font-family:"Prompt","Noto Sans Thai",sans-serif;font-size:19px}
.kpi.good b{color:var(--ok)} .kpi.warn b{color:var(--brand-text)}
.mrow{display:grid;grid-template-columns:auto 1fr auto auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line);cursor:pointer}
.mrow:first-of-type{border-top:0}
.mrow.paid .mname,.mrow.paid .mamt{opacity:.5;text-decoration:line-through}
.mname{font-weight:600}
.mg{color:var(--muted);font-size:13px}
.mamt{font-family:"Prompt","Noto Sans Thai",sans-serif;min-width:70px;text-align:right}
.share{font-family:ui-monospace,"Noto Sans Thai",monospace;font-size:13px;line-height:1.5}

/* locks & selection */
.lockbtn{width:100%;border:1.5px dashed var(--courtline);background:transparent;border-radius:10px;padding:6px 8px;font-size:13px;font-weight:600;cursor:pointer;color:var(--muted)}
.lockbtn.on{border-style:solid;border-color:var(--brand-text);background:var(--brand-soft);color:var(--brand-text)}
.match .chip.target,.chips .chip.target{border-style:dashed;border-color:var(--brand-text);animation:pulse 1.3s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(225,29,116,.35)}50%{box-shadow:0 0 0 6px rgba(225,29,116,0)}}
@media (prefers-reduced-motion:reduce){.match .chip.target,.chips .chip.target{animation:none}}
.lrow{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.lnames small{display:block;color:var(--muted);font-size:12.5px}
.lockadd{display:grid;grid-template-columns:1fr auto 1fr auto;gap:8px;align-items:center;margin-top:10px}
@media (max-width:380px){.lockadd{grid-template-columns:1fr auto 1fr}.lockadd .btn{grid-column:1/-1}}
.selbar{position:fixed;left:12px;right:12px;bottom:calc(84px + env(safe-area-inset-bottom, 0px));max-width:696px;margin:0 auto;background:var(--ink);color:#fff;border-radius:16px;padding:10px 12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;z-index:25;box-shadow:var(--shadow)}
.selbar .msg{flex:1 1 200px;font-size:14px;line-height:1.4}
.selbar b{color:var(--lime)}
.app.hasbar{padding-bottom:230px}
body.sel #toast{bottom:calc(172px + env(safe-area-inset-bottom, 0px))}

/* nav + toast */
#nav{position:fixed;left:0;right:0;bottom:0;max-width:720px;margin:0 auto;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:6px 8px calc(6px + env(safe-area-inset-bottom, 0px));z-index:20;box-shadow:0 -4px 18px rgba(0,0,0,.06)}
#nav button{border:0;background:transparent;border-radius:12px;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:1px;cursor:pointer;color:var(--muted);font-size:12px;font-weight:500}
#nav button .ic{font-size:20px;line-height:1.2}
#nav button.on{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;font-weight:600}
#toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom, 0px));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:30;max-width:88vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media (max-width:380px){
  .addrow{grid-template-columns:1fr 70px}
  .addrow .btn{grid-column:1/-1}
}
</style>
</head>
<body>
<div class="app" id="app"></div>
<nav id="nav" aria-label="เมนูหลัก"></nav>
<div id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
'use strict';

/* ---------- helpers ---------- */
var KEY = 'badminton-kuaa-v1';
var LEVELS = ['BG','N','S','P-','P','P+'];           // ระดับมือ (1–6)
var $ = function(s){ return document.querySelector(s); };
var uid = function(){ return Math.random().toString(36).slice(2,9); };
var esc = function(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); };
var num = function(v){ var n = parseFloat(v); return isFinite(n) && n > 0 ? n : 0; };
var fmt = function(n){ return (+n || 0).toLocaleString('th-TH', {maximumFractionDigits:2}); };
function todayISO(){ var d = new Date(), p = function(n){ return String(n).padStart(2,'0'); }; return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate()); }
function thDate(iso){
  if(!iso) return '';
  try{ var a = iso.split('-').map(Number); return new Date(a[0], a[1]-1, a[2]).toLocaleDateString('th-TH',{weekday:'long',day:'numeric',month:'long',year:'numeric'}); }
  catch(e){ return iso; }
}
function shuffle(a){ for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
var pk = function(x,y){ return x < y ? x+'|'+y : y+'|'+x; };

/* ---------- state ---------- */
function defaultState(){
  return {
    v:1, title:'ก๊วนตีมั่ว', date:todayISO(), venue:'',
    players:[],
    courts:[{id:uid(), name:'คอร์ท 1', start:'18:00', end:'20:00', price:0, unit:'hour', on:true}],
    expenses:[{id:uid(), name:'ลูกขนไก่ (หลอด)', qty:1, price:0}],
    set:{cost:'equal', round:1, mode:'random'},
    rounds:[], locks:[], tab:'players'
  };
}
function load(){
  try{
    var raw = localStorage.getItem(KEY);
    if(raw){
      var o = JSON.parse(raw);
      if(o && o.v === 1){
        var d = defaultState();
        o.set = Object.assign(d.set, o.set || {});
        if(o.title === 'ก๊วนแบดมินตัน') o.title = 'ก๊วนตีมั่ว';
        return Object.assign(d, o);
      }
    }
  }catch(e){}
  return defaultState();
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
var S = load();

/* transient UI state (ไม่เก็บถาวร) */
var sel = null, confirmKey = null, refocus = false, lastLevel = 3, confirmTimer = null;

/* ---------- domain logic ---------- */
var P = function(id){ return S.players.find(function(p){ return p.id === id; }); };
var C = function(id){ return S.courts.find(function(c){ return c.id === id; }); };
var lockIdx = function(x,y){ return (S.locks||[]).findIndex(function(L){ return (L.a===x && L.b===y) || (L.a===y && L.b===x); }); };
var lockOfPlayer = function(id){ return (S.locks||[]).find(function(L){ return L.a === id || L.b === id; }); };
var lockPartnerName = function(id){ var L = lockOfPlayer(id); if(!L) return ''; var q = P(L.a === id ? L.b : L.a); return q ? q.name : ''; };
function inBench(r, id){ return r.bench.indexOf(id) > -1; }

function hoursOf(c){
  if(!c.start || !c.end) return 0;
  var a = c.start.split(':').map(Number), b = c.end.split(':').map(Number);
  var d = (b[0]*60+b[1]) - (a[0]*60+a[1]);
  if(!isFinite(d)) return 0;
  if(d <= 0) d += 1440;
  return d/60;
}
function courtCost(c){ return c.unit === 'hour' ? num(c.price) * hoursOf(c) : num(c.price); }

function curRound(){ var r = S.rounds[S.rounds.length-1]; return r && !r.done ? r : null; }

/* สถิติจากรอบที่ปิดแล้ว: จำนวนเกม, เคยเป็นคู่กัน, เคยเจอกัน, รอบล่าสุดที่เล่น */
function stats(){
  var g = {}, last = {}, partner = {}, opp = {};
  S.players.forEach(function(p){ g[p.id] = 0; last[p.id] = -1; });
  S.rounds.filter(function(r){ return r.done; }).forEach(function(r){
    r.matches.forEach(function(m){
      m.a.concat(m.b).forEach(function(id){ g[id] = (g[id]||0) + 1; last[id] = r.no; });
      partner[pk(m.a[0],m.a[1])] = (partner[pk(m.a[0],m.a[1])]||0) + 1;
      partner[pk(m.b[0],m.b[1])] = (partner[pk(m.b[0],m.b[1])]||0) + 1;
      m.a.forEach(function(x){ m.b.forEach(function(y){ opp[pk(x,y)] = (opp[pk(x,y)]||0) + 1; }); });
    });
  });
  return {g:g, last:last, partner:partner, opp:opp};
}

/* คนที่มาสายเริ่มนับเกมเท่าคนที่เล่นน้อยสุด จะได้ไม่ต้องเล่นรัวๆ เพื่อไล่ให้ทัน */
function joinLate(p){
  if(!S.rounds.some(function(r){ return r.done; })) { p.base = 0; return; }
  var st = stats();
  var others = S.players.filter(function(q){ return q.in && q.id !== p.id; });
  if(!others.length){ p.base = 0; return; }
  var mn = Math.min.apply(null, others.map(function(q){ return (st.g[q.id]||0) + (q.base||0); }));
  p.base = Math.max(0, mn - (st.g[p.id]||0));
}

/* เลือกกลุ่มที่ลงสนามให้ครบพอดี: คู่ล็อกต้องมาพร้อมกัน เลือกชุดที่รวมแล้วเล่นน้อย/รอนานที่สุด */
function pickItems(items, cap){
  var INF = 1e18, n = items.length, dp = [], i, c;
  for(i=0;i<=n;i++){ dp.push(new Array(cap+1).fill(INF)); }
  dp[0][0] = 0;
  for(i=1;i<=n;i++){
    var it = items[i-1];
    for(c=0;c<=cap;c++){
      var best = dp[i-1][c];
      if(c >= it.size && dp[i-1][c-it.size] + it.cost < best) best = dp[i-1][c-it.size] + it.cost;
      dp[i][c] = best;
    }
  }
  if(dp[n][cap] >= INF) return null;
  var out = []; c = cap;
  for(i=n;i>=1;i--){
    if(dp[i][c] !== dp[i-1][c]){ out.push(items[i-1]); c -= items[i-1].size; }
  }
  return out;
}

function buildRound(){
  var st = stats();
  var elig = S.players.filter(function(p){ return p.in && !p.rest; });
  var courts = S.courts.filter(function(c){ return c.on; });
  if(!courts.length) return {err:'เลือกคอร์ทที่จะใช้ก่อน (อย่างน้อย 1 คอร์ท)'};
  if(elig.length < 4) return {err:'ต้องมีผู้เล่นพร้อมเล่นอย่างน้อย 4 คน (ตอนนี้ '+elig.length+' คน)'};
  var slots = Math.min(courts.length, Math.floor(elig.length/4));
  var eff = function(p){ return (st.g[p.id]||0) + (p.base||0); };

  // 1) เลือกคนลงสนาม: เล่นน้อยสุดก่อน → รอนานสุดก่อน → สุ่มในกลุ่มที่เท่ากัน
  var w = function(p){ return eff(p)*1000 + st.last[p.id]*10 + Math.random()*5; };
  var eligIds = {}; elig.forEach(function(p){ eligIds[p.id] = 1; });
  var usedL = {}, items = [];
  (S.locks || []).forEach(function(L){
    if(L.on !== false && eligIds[L.a] && eligIds[L.b] && !usedL[L.a] && !usedL[L.b]){
      usedL[L.a] = usedL[L.b] = 1;
      items.push({ids:[L.a,L.b], size:2, cost:w(P(L.a))+w(P(L.b))});
    }
  });
  elig.forEach(function(p){ if(!usedL[p.id]) items.push({ids:[p.id], size:1, cost:w(p)}); });
  var pickedItems = pickItems(items, slots*4);
  if(!pickedItems){ pickedItems = pickItems(elig.map(function(p){ return {ids:[p.id], size:1, cost:w(p)}; }), slots*4); }
  var fixed = pickedItems.filter(function(i){ return i.size === 2; }).map(function(i){ return i.ids; });
  var free = pickedItems.filter(function(i){ return i.size === 1; }).map(function(i){ return i.ids[0]; });
  var chosen = fixed.reduce(function(a,t){ return a.concat(t); }, []).concat(free);
  var bench = elig.filter(function(p){ return chosen.indexOf(p.id) < 0; }).map(function(p){ return p.id; });

  // 2) จัดคู่: สุ่มหลายร้อยแบบ แล้วเลือกแบบที่ซ้ำคู่เดิม/ฝ่ายตรงข้ามเดิมน้อยที่สุด
  var lv = function(id){ return P(id).level; };
  var pc = function(x,y){ return st.partner[pk(x,y)]||0; };
  var oc = function(x,y){ return st.opp[pk(x,y)]||0; };
  var best = null, bestScore = Infinity;
  for(var t=0; t<700; t++){
    var tf = shuffle(free.slice()), teams = fixed.slice();
    for(var k=0; k<tf.length; k+=2) teams.push([tf[k], tf[k+1]]);
    shuffle(teams);
    var arr = teams.reduce(function(a,tm){ return a.concat(tm); }, []), score = 0;
    for(var m=0; m<slots; m++){
      var q = arr.slice(m*4, m*4+4), a1=q[0], a2=q[1], b1=q[2], b2=q[3];
      score += 10*(pc(a1,a2)+pc(b1,b2));
      score += 2*(oc(a1,b1)+oc(a1,b2)+oc(a2,b1)+oc(a2,b2));
      if(S.set.mode === 'balance'){
        var l = [lv(a1),lv(a2),lv(b1),lv(b2)];
        score += 6*Math.abs(l[0]+l[1]-l[2]-l[3]) + (Math.max.apply(null,l)-Math.min.apply(null,l));
      }
    }
    if(score < bestScore){ bestScore = score; best = arr; if(score === 0) break; }
  }
  var matches = [];
  for(var i=0;i<slots;i++){
    matches.push({cid:courts[i].id, a:[best[i*4],best[i*4+1]], b:[best[i*4+2],best[i*4+3]]});
  }
  var no = S.rounds.length ? S.rounds[S.rounds.length-1].no + 1 : 1;
  return {round:{id:uid(), no:no, matches:matches, bench:bench, done:false}};
}

function costCalc(){
  var st = stats();
  var parts = S.players.filter(function(p){ return p.in || st.g[p.id] > 0; });
  var court = S.courts.reduce(function(s,c){ return s + courtCost(c); }, 0);
  var other = S.expenses.reduce(function(s,e){ return s + num(e.qty)*num(e.price); }, 0);
  var total = court + other, n = parts.length;
  var G = parts.reduce(function(s,p){ return s + st.g[p.id]; }, 0);
  var step = +S.set.round;
  var up = function(x){ return step === 0 ? Math.round(x*100)/100 : Math.ceil(x/step - 1e-9)*step; };
  var rows = parts.map(function(p){
    var g = st.g[p.id], raw = 0;
    if(n){
      if(S.set.cost === 'equal') raw = total/n;
      else if(S.set.cost === 'games') raw = G ? total*g/G : total/n;
      else raw = court/n + (G ? other*g/G : other/n);
    }
    return {p:p, g:g, raw:raw, amt:up(raw)};
  });
  var collected = rows.reduce(function(s,r){ return s + r.amt; }, 0);
  var paid = rows.reduce(function(s,r){ return s + (r.p.paid ? r.amt : 0); }, 0);
  return {rows:rows, court:court, other:other, total:total, n:n, collected:collected, paid:paid};
}

    '<div class="info">พร้อมเล่น <b>'+elig+'</b> คน · เปิดใช้ <b>'+con+'</b> คอร์ท → ลงสนามได้ <b>'+slots+'</b> คอร์ท ('+(slots*4)+' คน) · พัก '+Math.max(0,elig-slots*4)+' คน</div>'+
    '<button class="btn big" data-act="next">'+(S.rounds.length ? '🎲 สุ่มรอบถัดไป' : '🎲 สุ่มรอบแรก')+'</button>'+
    '<div class="btnrow">'+(cur ? '<button class="btn ghost" data-act="reroll">🔄 สุ่มรอบนี้ใหม่</button><button class="btn ghost" data-act="close">✔ ปิดรอบ (นับเกมแล้ว)</button>' : '')+'</div>'+
    '<p class="hint">ระบบให้คนที่เล่นน้อยและรอนานได้ลงก่อน พยายามไม่ให้จับคู่หรือเจอฝ่ายตรงข้ามซ้ำ การกด “สุ่มรอบถัดไป” จะปิดรอบที่เล่นอยู่และนับเกมให้อัตโนมัติ</p></div>';

  if(shown){
    h += '<div class="card"><div class="rtitle"><h2>รอบที่ '+shown.no+'</h2><span class="tag'+(cur?'':' done')+'">'+(cur?'กำลังเล่น':'ปิดรอบแล้ว')+'</span></div>'+
      (cur ? '<p class="hint" style="margin:-4px 0 10px">💡 แตะชื่อผู้เล่นบนคอร์ท แล้วแตะคนที่พักอยู่ (กรอบประสีชมพู) เพื่อสลับตัว · กด 🔓 ใต้ทีมเพื่อล็อกคู่ไว้ทุกรอบ</p>' : '')+
      roundHTML(shown, !!cur);
    var resting = S.players.filter(function(p){ return p.in && p.rest; });
    if(resting.length) h += '<p class="hint">⏸ พักอยู่ (ไม่ร่วมสุ่ม): '+resting.map(function(p){ return esc(p.name); }).join(', ')+'</p>';
    h += '</div>';
  }else{
    h += '<div class="card empty"><div class="big">🎲</div><p>กดสุ่มรอบแรกได้เลย<br>ต้องมีผู้เล่นพร้อมอย่างน้อย 4 คน และเปิดคอร์ทอย่างน้อย 1 คอร์ท</p></div>';
  }

  var st = stats();
  h += locksCard();
  var inP = S.players.filter(function(p){ return p.in; }).sort(function(a,b){ return (st.g[a.id]||0)-(st.g[b.id]||0); });
  if(inP.length){
    h += '<div class="card"><h2>เกมที่เล่นไปแล้ว</h2><div class="gstat">'+inP.map(function(p){ return '<span>'+esc(p.name)+' <b>'+(st.g[p.id]||0)+'</b></span>'; }).join('')+'</div></div>';
  }

  var hist = done.filter(function(r){ return r !== shown; }).reverse();
  if(hist.length){
    h += '<div class="card"><details><summary style="cursor:pointer;font-weight:600">ประวัติรอบก่อนหน้า ('+hist.length+')</summary>'+
      hist.map(function(r){
        return '<div class="hist"><b>รอบที่ '+r.no+'</b>'+r.matches.map(function(m){
          var c = C(m.cid), nm = function(i){ var p = P(i); return p ? esc(p.name) : '?'; };
          return '<div>'+(c?esc(c.name):'คอร์ท')+': '+nm(m.a[0])+' + '+nm(m.a[1])+' vs '+nm(m.b[0])+' + '+nm(m.b[1])+'</div>';
        }).join('')+'</div>';
      }).join('')+'</details></div>';
  }
  return h;
}

function summaryText(){
  var k = costCalc(), L = [];
  L.push('🏸 '+S.title);
  var meta = [thDate(S.date), S.venue].filter(Boolean).join(' • ');
  if(meta) L.push(meta);
  L.push('────────────');
  S.courts.forEach(function(c){ var v = courtCost(c); if(v>0) L.push(c.name+(c.start&&c.end?' '+c.start+'-'+c.end:'')+'  '+fmt(v)+' ฿'); });
  S.expenses.forEach(function(e){ var v = num(e.qty)*num(e.price); if(v>0) L.push(e.name+'  '+fmt(v)+' ฿'); });
  L.push('รวม '+fmt(k.total)+' ฿ ('+k.n+' คน)');
  L.push('────────────');
  k.rows.forEach(function(r,i){ L.push((i+1)+'. '+r.p.name+'  '+fmt(r.amt)+' ฿'+(r.p.paid?' ✅':'')); });
  return L.join('\n');
}

function tabMoney(){
  var k = costCalc(), h = '', diff = k.collected - k.total;
  var rd = [[0,'ไม่ปัด (ทศนิยม 2 ตำแหน่ง)'],[1,'ปัดขึ้นเป็นจำนวนเต็มบาท'],[5,'ปัดขึ้นเป็น 5 บาท'],[10,'ปัดขึ้นเป็น 10 บาท']];
  var modes = [
    ['equal','หารเท่ากันทุกคน','ทุกคนที่ลงชื่อจ่ายเท่ากัน ไม่สนว่าเล่นกี่เกม'],
    ['mixed','ค่าสนามหารเท่า + ค่าอื่นๆ ตามเกม','ค่าสนามหารเท่ากัน ส่วนลูกขนไก่และรายการอื่นแบ่งตามจำนวนเกมที่เล่น'],
    ['games','แบ่งตามจำนวนเกมที่เล่น','ทุกอย่างแบ่งตามสัดส่วนเกม คนที่ยังไม่ได้เล่นจะจ่าย 0 บาท']
  ];
  h += '<div class="card"><h2>วิธีแบ่งค่าใช้จ่าย</h2>'+
    modes.map(function(m){ return '<label class="radio"><input type="radio" name="cost" data-f="set:cost" value="'+m[0]+'"'+(S.set.cost===m[0]?' checked':'')+'><span><b>'+m[1]+'</b><small>'+m[2]+'</small></span></label>'; }).join('')+
    '<label class="fl" style="margin-top:10px">การปัดเศษต่อคน<select class="in" data-f="set:round">'+
    rd.map(function(r){ return '<option value="'+r[0]+'"'+(+S.set.round===r[0]?' selected':'')+'>'+r[1]+'</option>'; }).join('')+'</select></label></div>';

  h += '<div class="card"><h2>สรุปยอด</h2><div class="kpis">'+
    '<div class="kpi"><small>ค่าใช้จ่ายจริง</small><b>'+fmt(k.total)+' ฿</b></div>'+
    '<div class="kpi"><small>ยอดเก็บตามที่ปัดเศษ</small><b>'+fmt(k.collected)+' ฿</b></div>'+
    '<div class="kpi good"><small>เก็บแล้ว</small><b>'+fmt(k.paid)+' ฿</b></div>'+
    '<div class="kpi warn"><small>ค้างเก็บ</small><b>'+fmt(k.collected-k.paid)+' ฿</b></div></div>'+
    (k.n ? '<p class="hint">'+(Math.abs(diff)<0.005 ? 'ยอดเก็บเท่ากับค่าใช้จ่ายพอดี' : (diff>0 ? 'เก็บเกินค่าใช้จ่าย '+fmt(diff)+' ฿ (เศษจากการปัด)' : 'เก็บขาดไป '+fmt(-diff)+' ฿'))+'</p>' : '')+'</div>';

  if(!k.n){
    h += '<div class="card empty"><div class="big">💰</div><p>ยังไม่มีผู้เล่น ไปติ๊กลงชื่อที่แท็บ ลงชื่อ ก่อนนะ</p></div>';
  }else{
    var open = curRound();
    h += '<div class="card"><div class="rowhead"><h2>ยอดต่อคน ('+k.n+' คน)</h2></div>'+
      k.rows.map(function(r){
        return '<label class="mrow'+(r.p.paid?' paid':'')+'"><input type="checkbox" class="chk" style="margin:0" data-f="p:paid" data-id="'+r.p.id+'"'+(r.p.paid?' checked':'')+'>'+
          '<span class="mname">'+esc(r.p.name)+'</span><span class="mg">'+r.g+' เกม</span><b class="mamt">'+fmt(r.amt)+' ฿</b></label>';
      }).join('')+
      '<p class="hint">ติ๊กช่องหน้าชื่อเมื่อได้รับเงินแล้ว'+(open?' · รอบที่ '+open.no+' ยังไม่ได้ปิด จึงยังไม่นับเกมของรอบนี้':'')+'</p></div>';

    h += '<div class="card"><h2>ข้อความสรุปส่งเข้า LINE</h2><textarea id="sumtxt" class="in share" rows="'+Math.min(16, k.rows.length+8)+'" readonly>'+esc(summaryText())+'</textarea>'+
      '<div class="btnrow"><button class="btn" data-act="copy">📋 คัดลอกข้อความ</button></div></div>';
  }
  return h;
}

function render(){
  var tabs = [['players','👥','ลงชื่อ'],['courts','🏟️','คอร์ท/เงิน'],['match','🎲','จับคู่'],['money','💰','สรุปเงิน']];
  var body = {players:tabPlayers, courts:tabCourts, match:tabMatch, money:tabMoney}[S.tab] || tabPlayers;
  if(sel && (S.tab !== 'match' || !curRound())) sel = null;
  $('#app').className = 'app' + (sel ? ' hasbar' : '');
  document.body.classList.toggle('sel', !!sel);
  $('#app').innerHTML = hero() + body() + selBar();
  $('#nav').innerHTML = tabs.map(function(t){ return '<button class="'+(S.tab===t[0]?'on':'')+'" data-act="tab" data-id="'+t[0]+'"><span class="ic">'+t[1]+'</span>'+t[2]+'</button>'; }).join('');
  if(refocus){ var i = $('#newName'); if(i) i.focus(); refocus = false; }
}
function commit(){ save(); render(); }

var tt;
function toast(m){ var t = $('#toast'); t.textContent = m; t.classList.add('show'); clearTimeout(tt); tt = setTimeout(function(){ t.classList.remove('show'); }, 2600); }

/* ปุ่มที่ต้องกดซ้ำเพื่อยืนยัน (ใช้แทน confirm() ที่ถูกบล็อกในหน้าที่ฝังอยู่) */
function ask(key, fn){
  if(confirmKey === key){ confirmKey = null; clearTimeout(confirmTimer); fn(); return; }
  confirmKey = key; render();
  clearTimeout(confirmTimer);
  confirmTimer = setTimeout(function(){
    if(confirmKey !== key) return;
    confirmKey = null;
    var a = document.activeElement;
    if(!a || !/INPUT|TEXTAREA|SELECT/.test(a.tagName)) render();
  }, 3500);
}

/* ---------- actions ---------- */
function addOrTick(name, lv){
  var ex = S.players.find(function(p){ return p.name.trim().toLowerCase() === name.toLowerCase(); });
  if(ex){ if(!ex.in){ ex.in = true; joinLate(ex); } return false; }
  var p = {id:uid(), name:name, level:lv, in:true, rest:false, paid:false, base:0};
  S.players.push(p); joinLate(p); return true;
}
function swapIn(r, x, y){
  var find = function(id){
    for(var i=0;i<r.matches.length;i++){
      var m = r.matches[i], ks = ['a','b'];
      for(var j=0;j<2;j++){ var k = ks[j], ix = m[k].indexOf(id); if(ix > -1) return {arr:m[k], i:ix}; }
    }
    var b = r.bench.indexOf(id);
    return b > -1 ? {arr:r.bench, i:b} : null;
  };
  var X = find(x), Y = find(y);
  if(!X || !Y) return false;
  X.arr[X.i] = y; Y.arr[Y.i] = x;
  return true;
}
function startRound(replaceCurrent){
  var cur = curRound(), prevDone = false;
  if(cur){
    if(replaceCurrent){ S.rounds.pop(); } else { cur.done = true; prevDone = true; }
  }
  var res = buildRound();
  if(res.err){
    if(cur){ if(replaceCurrent) S.rounds.push(cur); else if(prevDone) cur.done = false; }
    toast(res.err); return;
  }
  S.rounds.push(res.round); sel = null; commit();
}

var A = {
  clearSel: function(){ sel = null; render(); },
  autoSwap: function(){
    var r = curRound(); if(!r || !sel || !r.bench.length) return;
    var st = stats();
    var eff = function(id){ var p = P(id); return (st.g[id]||0) + (p ? (p.base||0) : 0); };
    var pick = r.bench.slice().sort(function(a,b){ return (eff(a)-eff(b)) || ((st.last[a]||0)-(st.last[b]||0)); })[0];
    var n1 = P(sel), n2 = P(pick);
    if(swapIn(r, sel, pick)){ toast('สลับ '+(n1?n1.name:'?')+' ↔ '+(n2?n2.name:'?')+' แล้ว'); }
    sel = null; commit();
  },
  lockTeam: function(id){
    var r = S.rounds[S.rounds.length-1]; if(!r) return;
    var q = id.split(':'), m = r.matches[+q[0]]; if(!m) return;
    var t = m[q[1]], ix = lockIdx(t[0], t[1]);
    if(ix > -1){ S.locks.splice(ix, 1); toast('ปลดล็อกคู่แล้ว'); commit(); return; }
    if(lockOfPlayer(t[0]) || lockOfPlayer(t[1])){ toast('มีคนในทีมนี้ล็อกกับคนอื่นอยู่ ปลดล็อกคู่เดิมก่อนนะ'); return; }
    S.locks.push({id:uid(), a:t[0], b:t[1], on:true});
    toast('ล็อกคู่แล้ว จะลงสนามด้วยกันทุกรอบ'); commit();
  },
  addLock: function(){
    var a = $('#lockA').value, b = $('#lockB').value;
    if(!a || !b){ toast('เลือกผู้เล่นให้ครบ 2 คนก่อนนะ'); return; }
    if(a === b){ toast('เลือกคนเดียวกันไม่ได้นะ'); return; }
    if(lockOfPlayer(a) || lockOfPlayer(b)){ toast('มีคนที่ล็อกกับคนอื่นอยู่แล้ว'); return; }
    S.locks.push({id:uid(), a:a, b:b, on:true}); toast('ล็อกคู่แล้ว'); commit();
  },
  delLock: function(id){ S.locks = S.locks.filter(function(L){ return L.id !== id; }); commit(); },
  toggleLock: function(id){ var L = S.locks.find(function(x){ return x.id === id; }); if(L){ L.on = (L.on === false); commit(); } },
  tab: function(id){ S.tab = id; sel = null; confirmKey = null; commit(); window.scrollTo(0,0); },
  addPlayer: function(){
    var inp = $('#newName'), lv = parseInt($('#newLevel').value,10) || 3, name = inp.value.trim();
    lastLevel = lv;
    if(!name){ toast('พิมพ์ชื่อก่อนนะ'); inp.focus(); return; }
    addOrTick(name, lv); refocus = true; commit();
  },
  addBulk: function(){
    var lines = $('#bulk').value.split(/[\n,]+/).map(function(s){
      return s.replace(/^\s*[\d๐-๙]+\s*[.)\]:\-]*\s*/,'').trim();
    }).filter(Boolean);
    if(!lines.length){ toast('ยังไม่มีรายชื่อให้เพิ่ม'); return; }
    var added = 0, ticked = 0;
    lines.forEach(function(n){ n = n.slice(0,30); if(addOrTick(n, lastLevel)) added++; else ticked++; });
    toast('เพิ่มใหม่ '+added+' คน'+(ticked?' · ติ๊กลงชื่อคนเดิม '+ticked+' คน':'')); commit();
  },
  sample: function(){
    var names = [['บีม',5],['เจ',4],['ฟ้า',3],['แบงค์',6],['มิ้นท์',2],['ต้น',4],['นุ่น',3],['โอม',5],['พลอย',2],['กอล์ฟ',4],['เมย์',3],['ภูมิ',5]];
    names.forEach(function(n){ S.players.push({id:uid(), name:n[0], level:n[1], in:true, rest:false, paid:false, base:0}); });
    S.venue = S.venue || 'สนามตัวอย่าง';
    S.courts = [
      {id:uid(), name:'คอร์ท 1', start:'18:00', end:'20:00', price:150, unit:'hour', on:true},
      {id:uid(), name:'คอร์ท 2', start:'18:00', end:'20:00', price:150, unit:'hour', on:true}
    ];
    S.expenses = [{id:uid(), name:'ลูกขนไก่ (หลอด)', qty:2, price:420}];
    toast('โหลดตัวอย่างแล้ว ลองไปแท็บ จับคู่ ได้เลย'); commit();
  },
  allIn: function(){ S.players.forEach(function(p){ if(!p.in){ p.in = true; joinLate(p); } }); commit(); },
  allOut: function(){ S.players.forEach(function(p){ p.in = false; }); commit(); },
  rest: function(id){ var p = P(id); if(p){ p.rest = !p.rest; commit(); } },
  delP: function(id){
    ask('p:'+id, function(){
      var used = S.rounds.some(function(r){ return r.bench.indexOf(id) > -1 || r.matches.some(function(m){ return m.a.concat(m.b).indexOf(id) > -1; }); });
      if(used){ toast('คนนี้อยู่ในประวัติการเล่นแล้ว ลบไม่ได้ ให้เอาติ๊กลงชื่อออกแทน'); render(); return; }
      S.players = S.players.filter(function(p){ return p.id !== id; });
      S.locks = (S.locks || []).filter(function(L){ return L.a !== id && L.b !== id; }); commit();
    });
  },
  addCourt: function(){
    var l = S.courts[S.courts.length-1];
    S.courts.push({id:uid(), name:'คอร์ท '+(S.courts.length+1), start:l?l.start:'18:00', end:l?l.end:'20:00', price:l?l.price:0, unit:l?l.unit:'hour', on:true}); commit();
  },
  delC: function(id){
    var used = S.rounds.some(function(r){ return r.matches.some(function(m){ return m.cid === id; }); });
    if(used){ toast('คอร์ทนี้ถูกใช้ในรอบที่เล่นไปแล้ว ลบไม่ได้ (ปิดการใช้งานที่แท็บจับคู่แทน)'); return; }
    S.courts = S.courts.filter(function(c){ return c.id !== id; }); commit();
  },
  addExp: function(){ S.expenses.push({id:uid(), name:'', qty:1, price:0}); commit(); },
  delE: function(id){ S.expenses = S.expenses.filter(function(e){ return e.id !== id; }); commit(); },
  toggleCourt: function(id){ var c = C(id); if(c){ c.on = !c.on; commit(); } },
  mode: function(id){ S.set.mode = id; commit(); },
  next: function(){ startRound(false); },
  reroll: function(){ startRound(true); },
  close: function(){ var r = curRound(); if(r){ r.done = true; sel = null; toast('ปิดรอบที่ '+r.no+' แล้ว นับเกมให้ทุกคนเรียบร้อย'); commit(); } },
  pick: function(id){
    var r = curRound(); if(!r) return;
    if(!sel){ sel = id; }
    else if(sel === id){ sel = null; }
    else{ if(swapIn(r, sel, id)) save(); sel = null; }
    render();
  },
  newSession: function(){
    ask('newSession', function(){
      S.players.forEach(function(p){ p.in = false; p.rest = false; p.paid = false; p.base = 0; });
      S.rounds = []; S.date = todayISO(); S.tab = 'players'; sel = null;
      toast('เริ่มก๊วนใหม่แล้ว ติ๊กลงชื่อคนที่มาวันนี้ได้เลย'); commit();
    });
  },
  wipe: function(){ ask('wipe', function(){ S = defaultState(); sel = null; commit(); }); },
  copy: function(){
    var t = summaryText(), ta = $('#sumtxt');
    var done = function(ok){ toast(ok ? 'คัดลอกแล้ว วางใน LINE ได้เลย' : 'คัดลอกอัตโนมัติไม่ได้ แตะค้างที่กล่องข้อความแล้วเลือกคัดลอกเอง'); if(!ok && ta){ ta.focus(); ta.select(); } };
    var fallback = function(){
      try{ if(ta){ ta.focus(); ta.select(); done(document.execCommand('copy')); } else done(false); }catch(e){ done(false); }
    };
    if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(t).then(function(){ done(true); }, fallback); }
    else fallback();
  }
};

function onField(el){
  var parts = el.dataset.f.split(':'), k = parts[0], f = parts[1], id = el.dataset.id;
  var val = el.type === 'checkbox' ? el.checked : (el.type === 'number' ? num(el.value) : el.value);
  if(k === 'p'){
    var p = P(id); if(!p) return;
    if(f === 'in'){ p.in = val; if(val) joinLate(p); }
    else if(f === 'name'){ var n = String(val).trim(); if(n) p.name = n.slice(0,30); }
    else if(f === 'level'){ p.level = parseInt(val,10) || 3; }
    else if(f === 'paid'){ p.paid = val; }
  }else if(k === 'c'){
    var c = C(id); if(!c) return;
    if(f === 'name'){ c.name = String(val).trim() || c.name; } else c[f] = val;
  }else if(k === 'e'){
    var e = S.expenses.find(function(x){ return x.id === id; }); if(!e) return;
    e[f] = val;
  }else if(k === 's'){
    S[f] = val;
  }else if(k === 'set'){
    S.set[f] = (f === 'round') ? parseInt(val,10) : val;
  }
  commit();
}

document.addEventListener('click', function(ev){
  var el = ev.target.closest('[data-act]'); if(!el) return;
  var fn = A[el.dataset.act]; if(fn) fn(el.dataset.id, el);
});
document.addEventListener('change', function(ev){
  var el = ev.target.closest('[data-f]'); if(el) onField(el);
});
document.addEventListener('keydown', function(ev){
  if(ev.key === 'Enter' && ev.target && ev.target.id === 'newName'){ ev.preventDefault(); A.addPlayer(); }
});

render();
})();
</script>
