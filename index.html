<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#e11d74">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ก๊วนตีมั่ว">
<title>ก๊วนตีมั่ว — ลงชื่อ จับคู่ คิดเงิน</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&family=Prompt:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ffffff; --surface:#ffffff; --surface2:#f7f4fc; --ink:#2b2140; --muted:#6c6086; --line:#e9dcf0;
  --brand:#e11d74; --brand2:#0e6af0; --brand-ink:#ffffff; --brand-soft:#ffe3f0; --brand-text:#c4125f; --lime:#ffd93d; --lime-ink:#4a3500;
  --hero1:#e11d74; --hero2:#0e6af0; --hero-ink:#ffffff; --hero-pill:rgba(255,255,255,.22);
  --court:#e7f1ff; --courtline:#8fb8f5;
  --ta:#0e6af0; --ta-soft:#dcebff; --tb:#e11d74; --tb-soft:#ffdcec;
  --danger:#d92d20; --danger-soft:#ffe8e5; --danger-ink:#ffffff; --ok:#0f8a6a;
  --shadow:0 2px 4px rgba(110,60,150,.08),0 10px 26px rgba(70,60,160,.14);
  color-scheme: light;
  box-sizing:border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
html{scroll-padding-top: env(safe-area-inset-top, 0px);}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);background-image:radial-gradient(540px 320px at 0% 0%,rgba(255,120,180,.20),transparent 70%),radial-gradient(580px 340px at 100% 0%,rgba(90,160,255,.24),transparent 70%);background-repeat:no-repeat;background-attachment:fixed;color:var(--ink);font-family:"Noto Sans Thai","Sarabun",Tahoma,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
.app{max-width:720px;margin:0 auto;padding:14px 14px 112px}
h1,h2,h3{font-family:"Prompt","Noto Sans Thai",Tahoma,sans-serif;margin:0}
h2{font-size:17px;font-weight:600}
.card h2::before{content:"";display:inline-block;width:5px;height:16px;border-radius:3px;margin-right:8px;vertical-align:-2px;background:linear-gradient(180deg,var(--brand),var(--brand2))}

/* hero */
.hero{position:relative;overflow:hidden;background:repeating-linear-gradient(135deg,rgba(255,255,255,.08) 0 12px,transparent 12px 24px),linear-gradient(120deg,var(--hero1),var(--hero2));color:var(--hero-ink);border-radius:22px;padding:16px;margin-bottom:12px;box-shadow:0 10px 28px rgba(150,40,160,.25)}
.hart{position:absolute;right:-6px;top:-2px;width:150px;height:auto;pointer-events:none}
.hcopy{position:relative;max-width:calc(100% - 120px);min-height:88px}
.eyebrow{display:inline-block;background:rgba(255,255,255,.22);border-radius:99px;padding:2px 12px;font:600 13px "Prompt","Noto Sans Thai",sans-serif;margin-bottom:6px}
.hero h1{font-size:24px;font-weight:700;line-height:1.25}
.hero .sub{opacity:.93;font-size:13px;margin-top:3px}
.pills{position:relative;display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.pills span{background:var(--hero-pill);border-radius:99px;padding:3px 11px;font-size:13px;font-weight:600}
.hbtns{position:relative;display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.hb{border:0;border-radius:99px;padding:9px 16px;font-weight:700;font-size:14px;cursor:pointer;background:#fff;color:var(--brand-text);box-shadow:0 6px 14px rgba(0,0,0,.16)}
.hb.ghost{background:rgba(255,255,255,.22);color:#fff;box-shadow:none}
.hb:active{transform:translateY(1px)}
@media (min-width:640px){.hart{width:250px;right:14px;top:8px}.hcopy{max-width:calc(100% - 280px);min-height:96px}.hero h1{font-size:30px}.hero{padding:20px 22px}}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:var(--shadow);margin-bottom:12px}
.card h2{margin-bottom:10px}
.rowhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.rowhead h2{margin:0}
.hint{color:var(--muted);font-size:13px;margin:8px 0 0}
.empty{text-align:center;padding:22px 10px;color:var(--muted)}
.empty .big{font-size:34px}

/* inputs */
.in{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface2);color:var(--ink);font-size:16px;min-width:0}
.in:focus{outline:2px solid var(--brand-text);outline-offset:1px}
select.in{padding-right:6px}
.fl{display:block;font-size:13px;color:var(--muted);margin-bottom:10px}
.fl .in{margin-top:4px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
textarea.in{resize:vertical}
.addrow{display:grid;grid-template-columns:1fr 78px auto;gap:8px}
.lv{width:auto;min-width:64px;text-align:center}

/* buttons */
.btn{background:linear-gradient(135deg,var(--brand),var(--brand2));color:var(--brand-ink);border:0;border-radius:12px;padding:10px 16px;font-weight:600;cursor:pointer;font-size:15px}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:var(--brand-soft);color:var(--brand-text)}
.btn.danger{background:var(--danger-soft);color:var(--danger)}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:9px}
.btn.big{padding:14px 18px;font-size:17px;width:100%;font-family:"Prompt","Noto Sans Thai",sans-serif;box-shadow:0 6px 16px rgba(225,29,116,.32);letter-spacing:.2px}
.btn.ask{background:var(--danger);color:var(--danger-ink)}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.btnrow .btn{flex:1 1 auto}
.x{border:0;background:transparent;color:var(--muted);font-size:16px;cursor:pointer;border-radius:8px;padding:6px 8px;min-width:36px}
.x.ask{background:var(--danger);color:var(--danger-ink);font-size:13px;font-weight:600}

/* players */
.prow{display:grid;grid-template-columns:auto 1fr auto auto;gap:8px;align-items:start;padding:9px 0;border-top:1px solid var(--line)}
.prow:first-of-type{border-top:0}
.prow.off .nm{opacity:.55}
.chk{width:24px;height:24px;margin:8px 2px 0 0;accent-color:var(--brand-text)}
.prow .lv{margin-top:0}
.nm{font-weight:600}
.pmeta{display:flex;align-items:center;gap:8px;margin-top:4px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.pill{border:1px solid var(--line);background:var(--surface2);border-radius:99px;padding:1px 10px;font-size:12.5px;cursor:pointer}
.pill.on{background:var(--lime);border-color:var(--lime);color:var(--lime-ink);font-weight:600}
details.bulkd{margin-top:10px}
details.bulkd summary{cursor:pointer;color:var(--brand-text);font-weight:600;font-size:14px;padding:4px 0}
details.bulkd textarea{margin:8px 0}

/* courts & costs */
.crow,.erow{border:1px solid var(--line);border-radius:14px;padding:10px;margin-bottom:10px;background:var(--surface2)}
.crowtop{display:grid;grid-template-columns:1fr auto;gap:6px;align-items:center;margin-bottom:8px}
.crow .two{margin-bottom:0}
.sum{font-family:"Prompt","Noto Sans Thai",sans-serif;font-weight:600;color:var(--ok);padding:8px 2px}
.sum small{color:var(--muted);font-weight:400;font-family:"Noto Sans Thai",sans-serif}
.grid3b{display:grid;grid-template-columns:1fr 1fr auto;gap:10px;align-items:end}
.total{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:15px}
.total .t{font-family:"Prompt","Noto Sans Thai",sans-serif;font-weight:600;text-align:right}
.total .grand{font-size:18px;border-top:1px dashed var(--line);padding-top:8px;margin-top:4px}

/* match */
.togs{display:flex;flex-wrap:wrap;gap:8px}
.tog{border:1.5px solid var(--line);background:var(--surface2);border-radius:99px;padding:6px 14px;cursor:pointer;font-weight:500}
.tog.on{background:var(--brand);border-color:var(--brand);color:var(--brand-ink);font-weight:600}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:4px}
.seg button{border:0;background:transparent;border-radius:9px;padding:8px 6px;cursor:pointer;font-weight:500;font-size:14px}
.seg button.on{background:var(--brand);color:var(--brand-ink);font-weight:600}
.info{background:var(--brand-soft);border-radius:12px;padding:9px 12px;font-size:13.5px;margin:10px 0}
.matches{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:14px;margin-bottom:12px}
.match{border:1px solid var(--line);border-radius:18px;overflow:hidden;background:var(--surface);box-shadow:var(--shadow);container-type:inline-size}
.mhead{display:flex;justify-content:space-between;align-items:center;background:linear-gradient(90deg,var(--brand),var(--brand2));color:var(--brand-ink);padding:9px 14px;font-family:"Prompt","Noto Sans Thai",sans-serif;font-weight:600}
.mhead span{font-weight:500;font-size:13px;opacity:.92}
.mcourt{padding:10px;background:linear-gradient(135deg,#ffe3ef,#dcecff)}
.cfloor{position:relative;border-radius:12px;overflow:hidden;background:linear-gradient(160deg,#58a2ff,#2b6fe3)}
.cart{position:absolute;left:0;top:0;width:100%;height:100%}
.cart *{vector-effect:non-scaling-stroke}
.mbody{position:relative;display:grid;grid-template-columns:1fr 44px 1fr;min-height:176px}
.team{padding:9px 8px 10px;display:flex;flex-direction:column;gap:7px;justify-content:center;min-width:0}
.tl{align-self:flex-start;font:600 11.5px "Prompt","Noto Sans Thai",sans-serif;color:#fff;letter-spacing:.3px;margin:0 0 1px;background:rgba(8,30,110,.45);padding:1px 10px;border-radius:99px}
.vs{display:flex;align-items:center;justify-content:center}
.vs b{display:flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;font:700 12px "Prompt",sans-serif;box-shadow:0 0 0 3px rgba(255,255,255,.9),0 4px 10px rgba(0,0,0,.25)}
.av{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;font:700 14px/1 "Prompt","Noto Sans Thai",sans-serif;flex:none}
.chip{display:flex;align-items:center;gap:7px;width:100%;padding:6px 8px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font-weight:600;font-size:15px;line-height:1.2;text-align:left;box-shadow:0 2px 6px rgba(20,40,120,.18)}
button.chip{cursor:pointer}
.chip .cn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip i{font-style:normal;font-size:11px;font-weight:500;color:var(--muted);background:var(--surface2);border:1px solid var(--line);padding:1px 7px;border-radius:99px;white-space:nowrap}
.team .chip{background:#fff;border-color:transparent}
.team.ta .chip{border-left:5px solid var(--ta)}
.team.tb .chip{border-left:5px solid var(--tb)}
.chip.sel{box-shadow:0 0 0 3px var(--lime),0 0 0 5px var(--ink);transform:scale(1.03)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips .chip{width:auto;background:var(--surface);border:1.5px solid var(--line);box-shadow:none}
.bench{margin-top:4px}
.lbl{font-size:13px;color:var(--muted);margin:2px 0 8px;font-weight:500}
.rtitle{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;gap:8px;flex-wrap:wrap}
.tag{font-size:12px;border-radius:99px;padding:2px 10px;background:var(--lime);color:var(--lime-ink);font-weight:600}
.tag.done{background:var(--surface2);color:var(--muted);border:1px solid var(--line)}
.hist{border-top:1px solid var(--line);padding:8px 0;font-size:13.5px}
.hist b{font-family:"Prompt",sans-serif}
.hist div{color:var(--muted)}
.gstat{display:flex;flex-wrap:wrap;gap:6px}
.gstat span{background:var(--surface2);border:1px solid var(--line);border-radius:99px;padding:2px 10px;font-size:13px}
.gstat b{color:var(--brand-text)}

/* money */
.radio{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line);cursor:pointer}
.radio:first-of-type{border-top:0}
.radio input{margin-top:5px;accent-color:var(--brand-text);width:18px;height:18px}
.radio small{display:block;color:var(--muted);font-size:12.5px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.kpi small{color:var(--muted);display:block;font-size:12.5px}
.kpi b{font-family:"Prompt","Noto Sans Thai",sans-serif;font-size:19px}
.kpi.good b{color:var(--ok)} .kpi.warn b{color:var(--brand-text)}
.mrow{display:grid;grid-template-columns:auto 1fr auto auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line);cursor:pointer}
.mrow:first-of-type{border-top:0}
.mrow.paid .mname,.mrow.paid .mamt{opacity:.5;text-decoration:line-through}
.mname{font-weight:600}
.mg{color:var(--muted);font-size:13px}
.mamt{font-family:"Prompt","Noto Sans Thai",sans-serif;min-width:70px;text-align:right}
.share{font-family:ui-monospace,"Noto Sans Thai",monospace;font-size:13px;line-height:1.5}

/* history */
.hlist .hrow{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.hlist .hrow:first-child{border-top:0}
.hrow small{display:block;color:var(--muted);font-size:12.5px}
.hrow .act{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.old{color:var(--danger);font-weight:600}
.okk{color:var(--ok);font-weight:600;font-size:13px}
.badge{background:var(--lime);color:var(--lime-ink);border-radius:99px;padding:1px 8px;font-size:11.5px;font-style:normal;font-weight:600;margin-left:6px}
.hs{border:1px solid var(--line);border-radius:14px;margin-bottom:10px;overflow:hidden;background:var(--surface)}
.hhead{display:grid;grid-template-columns:1fr auto;gap:2px 10px;width:100%;text-align:left;border:0;background:var(--surface2);padding:10px 12px;cursor:pointer}
.hhead.open{background:var(--brand-soft)}
.hd,.ht{font-family:"Prompt","Noto Sans Thai",sans-serif;font-weight:600}
.ht{text-align:right}
.hm{color:var(--muted);font-size:13px}
.hs2{text-align:right;font-size:13px}
.hbody{padding:6px 12px 12px;border-top:1px solid var(--line)}

/* locks & selection */
.lockbtn{width:100%;border:1.5px dashed var(--courtline);background:transparent;border-radius:10px;padding:6px 8px;font-size:13px;font-weight:600;cursor:pointer;color:var(--muted)}
.lockbtn.on{border-style:solid;border-color:var(--brand-text);background:var(--brand-soft);color:var(--brand-text)}
.match .chip.target,.chips .chip.target{border-style:dashed;border-color:var(--brand-text);animation:pulse 1.3s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(225,29,116,.35)}50%{box-shadow:0 0 0 6px rgba(225,29,116,0)}}
@media (prefers-reduced-motion:reduce){.match .chip.target,.chips .chip.target{animation:none}}
.lrow{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.lnames small{display:block;color:var(--muted);font-size:12.5px}
.lockadd{display:grid;grid-template-columns:1fr auto 1fr auto;gap:8px;align-items:center;margin-top:10px}
@media (max-width:380px){.lockadd{grid-template-columns:1fr auto 1fr}.lockadd .btn{grid-column:1/-1}}
.selbar{position:fixed;left:12px;right:12px;bottom:calc(84px + env(safe-area-inset-bottom, 0px));max-width:696px;margin:0 auto;background:var(--ink);color:#fff;border-radius:16px;padding:10px 12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;z-index:25;box-shadow:var(--shadow)}
.selbar .msg{flex:1 1 200px;font-size:14px;line-height:1.4}
.selbar b{color:var(--lime)}
.app.hasbar{padding-bottom:230px}
body.sel #toast{bottom:calc(172px + env(safe-area-inset-bottom, 0px))}

/* nav + toast */
#nav{position:fixed;left:0;right:0;bottom:0;max-width:720px;margin:0 auto;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);gap:2px;padding:6px 8px calc(6px + env(safe-area-inset-bottom, 0px));z-index:20;box-shadow:0 -4px 18px rgba(0,0,0,.06)}
#nav button{border:0;background:transparent;border-radius:12px;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:1px;cursor:pointer;color:var(--muted);font-size:12px;font-weight:500}
#nav button .ic{font-size:20px;line-height:1.2}
#nav button.on{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;font-weight:600}
#toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom, 0px));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:30;max-width:88vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media (max-width:380px){
  .addrow{grid-template-columns:1fr 70px}
  .addrow .btn{grid-column:1/-1}
}

/* stats strip */
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px}
.stat{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px 12px;box-shadow:var(--shadow);min-width:0}
.sic{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font:700 16px "Prompt","Noto Sans Thai",sans-serif;flex:none}
.stat b{display:block;font:700 19px/1.15 "Prompt","Noto Sans Thai",sans-serif;white-space:nowrap}
.stat b .u{font:500 12px "Noto Sans Thai",sans-serif;color:var(--muted)}
.stat div small{display:block;color:var(--muted);font-size:12px}
@media (min-width:560px){.stats{grid-template-columns:repeat(4,1fr)}}

/* court look: lock buttons on the blue floor, avatars */
.cfloor .lockbtn{background:rgba(255,255,255,.18);color:#fff;border:1.5px dashed rgba(255,255,255,.75)}
.cfloor .lockbtn.on{background:#fff;color:var(--brand-text);border:1.5px solid #fff}
@media (max-width:420px){.match .chip .av{display:none}}
@container (max-width:430px){.chip .av{display:none}}
.prow>.av{display:none}
@media (min-width:480px){.prow{grid-template-columns:auto auto 1fr auto auto}.prow>.av{display:inline-flex;width:34px;height:34px;margin-top:3px}}

/* side panels */
.split{display:grid;grid-template-columns:minmax(0,1fr);gap:0 14px}
@media (min-width:1100px){.split{grid-template-columns:minmax(0,1fr) 320px;align-items:start}}
.srow{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.srow:first-child{border-top:0}
.srow b{font-family:"Prompt","Noto Sans Thai",sans-serif}
.prw{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.prw:first-child{border-top:0}
.prw .av{width:34px;height:34px}
.prw b{display:block;font-size:14.5px}
.prw small{display:block;color:var(--muted);font-size:12.5px}
.prw .pg{color:var(--muted);font-size:13px;white-space:nowrap}
.st.play{color:var(--ta);font-weight:600}
.st.ready{color:var(--ok);font-weight:600}
.st.bench,.st.rest{color:var(--muted)}

/* sidebar on wide screens */
.navbrand,.navart{display:none}
@media (min-width:960px){
  body{padding-left:236px}
  .app{max-width:1080px;padding:22px 26px 40px}
  #nav{left:0;right:auto;top:0;bottom:0;width:236px;max-width:none;margin:0;display:flex;flex-direction:column;gap:6px;padding:22px 14px 0;background:linear-gradient(185deg,#d81b72 0%,#8a2cc4 52%,#0e6af0 100%);border-top:0;box-shadow:none;overflow:hidden}
  .navbrand{display:flex;align-items:center;gap:10px;color:#fff;margin:0 6px 18px}
  .navbrand b{display:block;font:700 19px/1.2 "Prompt","Noto Sans Thai",sans-serif}
  .navbrand small{display:block;font-size:12px;opacity:.88}
  #nav button{flex-direction:row;justify-content:flex-start;gap:12px;font-size:15.5px;padding:12px 14px;border-radius:14px;color:rgba(255,255,255,.92)}
  #nav button .ic{font-size:20px;width:26px;text-align:center}
  #nav button.on{background:#fff;color:var(--brand-text);box-shadow:0 6px 16px rgba(0,0,0,.18)}
  .navart{display:block;margin-top:auto;width:calc(100% + 28px);margin-left:-14px;margin-bottom:-6px;pointer-events:none}
  .selbar{left:250px;right:14px;max-width:none}
  #toast{left:calc(50% + 118px)}
  .app.hasbar{padding-bottom:140px}
}

/* per-court cards */
.gmeta{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:0 2px 8px;font-size:13px}
.gmeta .elapsed{color:var(--muted);font-size:12.5px;text-align:right}
.cact{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 10px 12px}
.cact .btn.pri{grid-column:1/-1}
.cact .btn{padding:9px 8px;font-size:13.5px}
.cfloor.free{filter:saturate(.45) brightness(1.06)}
.freemsg{grid-column:1/-1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:#fff;font:700 20px "Prompt","Noto Sans Thai",sans-serif;text-shadow:0 2px 8px rgba(0,30,110,.45);padding:34px 10px}
.freemsg small{font:500 13px "Noto Sans Thai",sans-serif}
.rk{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;border-radius:50%;background:var(--ink);color:#fff;font:700 10.5px "Prompt",sans-serif;flex:none}

/* online + player page */
body.player{padding-left:0}
body.player #nav{display:none}
body.player .app{max-width:640px;padding-bottom:40px}
.pbanner{position:sticky;top:calc(8px + env(safe-area-inset-top, 0px));z-index:40;border-radius:16px;padding:12px 14px;margin-bottom:12px;color:#fff;box-shadow:0 10px 28px rgba(0,0,0,.25);animation:pop .35s ease}
.pbanner.turn{background:linear-gradient(135deg,var(--brand),var(--brand2))}
.pbanner.near{background:linear-gradient(135deg,#f59e0b,#ea580c)}
.pbanner .bt{display:flex;justify-content:space-between;align-items:center;font:700 17px "Prompt","Noto Sans Thai",sans-serif}
.pbanner .bx{border:0;background:rgba(255,255,255,.25);color:#fff;border-radius:50%;width:28px;height:28px;cursor:pointer}
.pstat{text-align:center}
.pstat .who{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:8px}
.pstat .who i{font-style:normal;color:var(--muted);font-size:13px}
.pstat .pbig{font:700 26px/1.25 "Prompt","Noto Sans Thai",sans-serif}
.pstat .psmall{color:var(--muted);margin-bottom:8px}
.pstat.play{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;border:0}
.pstat.play .psmall,.pstat.play .who i{color:rgba(255,255,255,.92)}
.pstat.near{background:#fff4d6;border-color:#f7d070}
.chip.me{box-shadow:0 0 0 3px var(--lime),0 0 0 5px var(--ink)}
@keyframes pop{from{transform:translateY(-8px);opacity:0}to{transform:none;opacity:1}}

@media (min-width:640px){.himg{width:56%;background-position:60% 30%}}
.hero .hcopy,.hero .pills,.hero .hbtns{z-index:1}
.hero .pills span{background:rgba(60,12,100,.38)}
.hero .hb.ghost{background:rgba(60,12,100,.42);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.mascot{width:108px;height:108px;border-radius:50%;margin:0 auto 10px;background-repeat:no-repeat;box-shadow:0 0 0 4px #fff,0 10px 24px rgba(150,40,160,.28)}

.mascot.m2{background-image:var(--simg);background-size:320%;background-position:48% 7%}
.mascot.m3{background-image:var(--cimg);background-size:320%;background-position:40% 17%}
.pstat.play{position:relative;overflow:hidden;text-align:left;padding-right:44%}
.pstat.play::after{content:"";position:absolute;right:0;top:0;bottom:0;width:56%;background:var(--cimg) 50% 24%/cover no-repeat;-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 46%);mask-image:linear-gradient(90deg,transparent 0,#000 46%);pointer-events:none}
.pstat.play>*{position:relative;z-index:1}
.pstat.play .who{justify-content:flex-start}
.pstat.play .pbig{font-size:23px}
.pstat.play .btnrow{justify-content:flex-start !important}

/* ---------- picture art on court cards ---------- */
.match{position:relative}
.mhead{position:relative;display:block;min-height:88px;padding:12px 14px;overflow:hidden}
.mname{position:relative;z-index:1;max-width:46%}
.mname b{display:block;font:600 18px/1.25 "Prompt","Noto Sans Thai",sans-serif}
.mname small{display:block;font:500 13px "Noto Sans Thai",sans-serif;opacity:.92}
.mart{position:absolute;right:0;top:0;bottom:0;width:min(68%,330px);background-repeat:no-repeat;background-size:cover;pointer-events:none;
  -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 38%);mask-image:linear-gradient(90deg,transparent 0,#000 38%)}
.mart.pd{background-image:var(--dimg);background-position:46% 30%}
.mart.ph{background-image:var(--himg);background-position:62% 20%}
.mart.ps{background-image:var(--simg);background-position:50% 6%}
.mart.pc{background-image:var(--cimg);background-position:42% 18%}
.cfloor.free{filter:none;background:linear-gradient(160deg,#9bbbe6,#7a9bd3)}
.cfloor.free .cart{opacity:.5}
.freepic{position:absolute;right:0;top:0;bottom:0;width:54%;background-repeat:no-repeat;background-size:cover;opacity:.9;pointer-events:none;
  -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 42%);mask-image:linear-gradient(90deg,transparent 0,#000 42%)}
.freepic.pd{background-image:var(--dimg);background-position:44% 50%}
.freepic.ph{background-image:var(--himg);background-position:40% 40%}
.freepic.ps{background-image:var(--simg);background-position:50% 40%}
.freepic.pc{background-image:var(--cimg);background-position:50% 36%}
.freemsg{grid-column:1/-1;align-items:flex-start;text-align:left;width:56%;padding:38px 6px 38px 16px;font-size:19px;position:relative;z-index:1}
.cele{position:absolute;left:0;right:0;top:88px;bottom:0;z-index:6;display:flex;align-items:center;padding:8px 18px;color:#fff;pointer-events:none;animation:celeAnim 2.5s ease both;
  background:linear-gradient(90deg,rgba(225,29,116,.94) 0%,rgba(130,40,200,.66) 48%,rgba(14,106,240,.12) 100%),var(--cv) center/cover no-repeat}
.cele.pd{--cv:var(--dimg)}.cele.ph{--cv:var(--himg)}.cele.ps{--cv:var(--simg)}.cele.pc{--cv:var(--cimg)}
.cele-txt{max-width:58%}
.cele-txt b{display:block;font:700 28px/1.15 "Prompt","Noto Sans Thai",sans-serif;text-shadow:0 3px 12px rgba(40,0,80,.45)}
.cele-txt small{display:block;margin-top:5px;font:500 15px "Noto Sans Thai",sans-serif;text-shadow:0 2px 8px rgba(40,0,80,.4)}
@keyframes celeAnim{0%{opacity:0;transform:scale(.94)}10%{opacity:1;transform:scale(1)}78%{opacity:1}100%{opacity:0;visibility:hidden}}
@media (prefers-reduced-motion:reduce){.cele{animation-name:celeFade}@keyframes celeFade{0%,80%{opacity:1}100%{opacity:0;visibility:hidden}}}

/* ---------- level picker ---------- */
.lvbtn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1.5px solid var(--line);background:var(--surface2);color:var(--ink);border-radius:10px;padding:9px 10px;font:600 15px "Noto Sans Thai",sans-serif;cursor:pointer;white-space:nowrap;min-width:78px}

<body>
<div class="app" id="app"></div>
<nav id="nav" aria-label="เมนูหลัก"></nav>
<div id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
'use strict';

/* ---------- helpers ---------- */
var KEY = 'badminton-kuaa-v1';
var LV_MIG = {1:2, 2:3, 3:5, 4:6, 5:7, 6:8};   // ระดับเดิม (BG,N,S,P-,P,P+) -> เลเวล 1-10
var $ = function(s){ return document.querySelector(s); };
var uid = function(){ return Math.random().toString(36).slice(2,9); };
var esc = function(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); };
var num = function(v){ var n = parseFloat(v); return isFinite(n) && n > 0 ? n : 0; };
var fmt = function(n){ return (+n || 0).toLocaleString('th-TH', {maximumFractionDigits:2}); };
function todayISO(){ var d = new Date(), p = function(n){ return String(n).padStart(2,'0'); }; return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate()); }
function thDate(iso){
  if(!iso) return '';
  try{ var a = iso.split('-').map(Number); return new Date(a[0], a[1]-1, a[2]).toLocaleDateString('th-TH',{weekday:'long',day:'numeric',month:'long',year:'numeric'}); }
  catch(e){ return iso; }
}
function shuffle(a){ for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
var pk = function(x,y){ return x < y ? x+'|'+y : y+'|'+x; };

/* ---------- state ---------- */
function defaultState(){
  return {
    v:1, title:'ก๊วนตีมั่ว', date:todayISO(), venue:'',
    players:[],
    courts:[{id:uid(), name:'คอร์ท 1', start:'18:00', end:'20:00', price:0, unit:'hour', on:true}],
    expenses:[{id:uid(), name:'ลูกขนไก่ (หลอด)', qty:1, price:0}],
    set:{cost:'equal', round:1, mode:'random', askRes:true},
    games:[], fin:0, locks:[], history:[], sid:uid(), lastBackup:'', lvv:2, tab:'players'
  };
}
/* แปลงข้อมูลเก่าแบบ "รอบ" เป็นแบบ "เกมรายสนาม" */
function migrateLv(o){
  if(!o || o.lvv === 2) return;
  var had = false;
  (o.players || []).forEach(function(p){ if(p && LV_MIG[p.level]){ p.level = LV_MIG[p.level]; had = true; } if(p) p.lvBy = p.lvBy || 'm'; });
  o.lvv = 2; if(had) o.lvMigrated = true;
}
function migrate(o){
  migrateLv(o);
  if(Array.isArray(o.games)) { delete o.rounds; return o; }
  var games = [], n = 0, fin = 0;
  (o.rounds || []).forEach(function(r){
    (r.matches || []).forEach(function(m){
      n++;
      games.push({id:uid(), no:n, cid:m.cid, a:(m.a||[]).slice(), b:(m.b||[]).slice(), t0:0, t1:r.done ? 1 : null, done:!!r.done, fin:r.done ? (r.no||0) : 0});
    });
    if(r.done) fin = Math.max(fin, r.no || 0);
  });
  o.games = games; o.fin = fin; delete o.rounds;
  return o;
}
function load(){
  try{
    var raw = localStorage.getItem(KEY);
    if(raw){
      var o = JSON.parse(raw);
      if(o && o.v === 1){
        migrate(o);
        var d = defaultState();
        o.set = Object.assign(d.set, o.set || {});
        if(o.title === 'ก๊วนแบดมินตัน') o.title = 'ก๊วนตีมั่ว';
        return Object.assign(d, o);
      }
    }
  }catch(e){}
  return defaultState();
}
function save(){ archive(); try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} onSaved(); }
var S = load();

/* transient UI state (ไม่เก็บถาวร) */
var sel = null, confirmKey = null, refocus = false, lastLevel = 5, confirmTimer = null, openH = {}, openR = {}, pendingRestore = null, bkText = '';

/* ---------- domain logic ---------- */
var P = function(id){ return S.players.find(function(p){ return p.id === id; }); };
var C = function(id){ return S.courts.find(function(c){ return c.id === id; }); };
var lockIdx = function(x,y){ return (S.locks||[]).findIndex(function(L){ return (L.a===x && L.b===y) || (L.a===y && L.b===x); }); };
var lockOfPlayer = function(id){ return (S.locks||[]).find(function(L){ return L.a === id || L.b === id; }); };
var lockPartnerName = function(id){ var L = lockOfPlayer(id); if(!L) return ''; var q = P(L.a === id ? L.b : L.a); return q ? q.name : ''; };
var nowMs = function(){ return Date.now(); };
function activeGames(){ return S.games.filter(function(g){ return !g.done; }); }
function gameOnCourt(cid){ return S.games.find(function(g){ return !g.done && g.cid === cid; }); }
function busyIds(){ var m = {}; activeGames().forEach(function(g){ g.a.concat(g.b).forEach(function(id){ m[id] = 1; }); }); return m; }
function poolPlayers(){ var b = busyIds(); return S.players.filter(function(p){ return p.in && !p.rest && !b[p.id]; }); }
function doneGames(){ return S.games.filter(function(g){ return g.done; }); }
/* ลำดับคิว: เล่นน้อยก่อน → รอนานก่อน (ใช้แสดงผล) */
function queueOrder(){
  var st = stats(), eff = function(p){ return (st.g[p.id]||0) + (p.base||0); };
  return poolPlayers().sort(function(a,b){ return (eff(a)-eff(b)) || (st.last[a.id]-st.last[b.id]) || (S.players.indexOf(a)-S.players.indexOf(b)); });
}
function locate(id){
  var gs = activeGames();
  for(var i=0;i<gs.length;i++){
    var ks = ['a','b'];
    for(var j=0;j<2;j++){ var ix = gs[i][ks[j]].indexOf(id); if(ix > -1) return {arr:gs[i][ks[j]], i:ix, game:gs[i]}; }
  }
  return null;
}
function entryGames(e){
  if(Array.isArray(e.games)) return e.games;
  var out = [], n = 0;
  (e.rounds || []).forEach(function(r){ (r.matches || []).forEach(function(m){ n++; out.push({no:n, court:m.court, a:m.a, b:m.b}); }); });
  return out;
}

function hoursOf(c){
  if(!c.start || !c.end) return 0;
  var a = c.start.split(':').map(Number), b = c.end.split(':').map(Number);
  var d = (b[0]*60+b[1]) - (a[0]*60+a[1]);
  if(!isFinite(d)) return 0;
  if(d <= 0) d += 1440;
  return d/60;
}
function courtCost(c){ return c.unit === 'hour' ? num(c.price) * hoursOf(c) : num(c.price); }


/* สถิติจากเกมที่จบแล้ว: จำนวนเกม, เคยเป็นคู่กัน, เคยเจอกัน, ลำดับที่จบเกมล่าสุด */
function stats(){
  var g = {}, last = {}, partner = {}, opp = {};
  S.players.forEach(function(p){ g[p.id] = 0; last[p.id] = -1; });
  S.games.filter(function(m){ return m.done; }).forEach(function(m){
    m.a.concat(m.b).forEach(function(id){ g[id] = (g[id]||0) + 1; last[id] = Math.max(last[id] === undefined ? -1 : last[id], m.fin || 0); });
    partner[pk(m.a[0],m.a[1])] = (partner[pk(m.a[0],m.a[1])]||0) + 1;
    partner[pk(m.b[0],m.b[1])] = (partner[pk(m.b[0],m.b[1])]||0) + 1;
    m.a.forEach(function(x){ m.b.forEach(function(y){ opp[pk(x,y)] = (opp[pk(x,y)]||0) + 1; }); });
  });
  return {g:g, last:last, partner:partner, opp:opp};
}

/* คนที่มาสายเริ่มนับเกมเท่าคนที่เล่นน้อยสุด จะได้ไม่ต้องเล่นรัวๆ เพื่อไล่ให้ทัน */
function joinLate(p){
  if(!S.games.some(function(r){ return r.done; })) { p.base = 0; return; }
  var st = stats();
  var others = S.players.filter(function(q){ return q.in && q.id !== p.id; });
  if(!others.length){ p.base = 0; return; }
  var mn = Math.min.apply(null, others.map(function(q){ return (st.g[q.id]||0) + (q.base||0); }));
  p.base = Math.max(0, mn - (st.g[p.id]||0));
}

/* เลือกกลุ่มที่ลงสนามให้ครบพอดี: คู่ล็อกต้องมาพร้อมกัน เลือกชุดที่รวมแล้วเล่นน้อย/รอนานที่สุด */
function pickItems(items, cap){
  var INF = 1e18, n = items.length, dp = [], i, c;
  for(i=0;i<=n;i++){ dp.push(new Array(cap+1).fill(INF)); }
  dp[0][0] = 0;
  for(i=1;i<=n;i++){
    var it = items[i-1];
    for(c=0;c<=cap;c++){
      var best = dp[i-1][c];
      if(c >= it.size && dp[i-1][c-it.size] + it.cost < best) best = dp[i-1][c-it.size] + it.cost;
      dp[i][c] = best;
    }
  }
  if(dp[n][cap] >= INF) return null;
  var out = []; c = cap;
  for(i=n;i>=1;i--){
    if(dp[i][c] !== dp[i-1][c]){ out.push(items[i-1]); c -= items[i-1].size; }
  }
  return out;
}

/* สุ่ม 1 เกมให้สนามที่ระบุ จากคนที่รออยู่
   เลือกกลุ่ม 4 คนที่ "ยุติธรรมที่สุด" (เล่นน้อยก่อน รอนานก่อน ห่างกันได้ไม่เกิน 1 เกม)
   และ "หลากหลายที่สุด" (ไม่ซ้ำคู่/ฝ่ายตรงข้ามเดิม) พร้อมกัน คู่ล็อกไปด้วยกันเสมอ */
function buildGame(cid, avoid){
  var st = stats(), pool = poolPlayers();
  if(pool.length < 4) return {err:'ต้องมีผู้เล่นรอลงสนามอย่างน้อย 4 คน (ตอนนี้ '+pool.length+' คน)'};
  var eff = function(p){ return (st.g[p.id]||0) + (p.base||0); };
  var minEff = Math.min.apply(null, pool.map(eff));
  var cand = pool.filter(function(p){ return eff(p) <= minEff + 1; });
  if(cand.length < 4) cand = pool;
  var lasts = cand.map(function(p){ return st.last[p.id]; });
  var lo = Math.min.apply(null, lasts), span = Math.max.apply(null, lasts) - lo + 1;
  var av = {}; (avoid || []).forEach(function(id){ av[id] = 1; });
  var w = function(p){ return eff(p)*1000 + ((st.last[p.id]-lo)/span)*400 + (av[p.id] ? 500 : 0) + Math.random()*5; };
  var cw = {}; cand.forEach(function(p){ cw[p.id] = w(p); });
  var candIds = {}; cand.forEach(function(p){ candIds[p.id] = 1; });
  var usedL = {}, items = [];
  (S.locks || []).forEach(function(L){
    if(L.on !== false && candIds[L.a] && candIds[L.b] && !usedL[L.a] && !usedL[L.b]){
      usedL[L.a] = usedL[L.b] = 1; items.push({ids:[L.a,L.b], size:2});
    }
  });
  cand.forEach(function(p){ if(!usedL[p.id]) items.push({ids:[p.id], size:1}); });

  var lv = function(id){ return P(id).level; };
  var pc = function(x,y){ return st.partner[pk(x,y)]||0; };
  var oc = function(x,y){ return st.opp[pk(x,y)]||0; };
  var best = null, bestScore = Infinity;
  var evalSet = function(chosen){
    var fixed = chosen.filter(function(i){ return i.size === 2; }).map(function(i){ return i.ids; });
    var free = chosen.filter(function(i){ return i.size === 1; }).map(function(i){ return i.ids[0]; });
    var fair = 0; chosen.forEach(function(i){ i.ids.forEach(function(id){ fair += cw[id]; }); });
    if(fair >= bestScore) return;
    var options = [];
    if(fixed.length === 2) options.push([fixed[0], fixed[1]]);
    else if(fixed.length === 1) options.push([fixed[0], free]);
    else{
      options.push([[free[0],free[1]], [free[2],free[3]]]);
      options.push([[free[0],free[2]], [free[1],free[3]]]);
      options.push([[free[0],free[3]], [free[1],free[2]]]);
    }
    options.forEach(function(o){
      var A_ = o[0], B_ = o[1];
      var pair = 20*(10*(pc(A_[0],A_[1]) + pc(B_[0],B_[1])) + 2*(oc(A_[0],B_[0]) + oc(A_[0],B_[1]) + oc(A_[1],B_[0]) + oc(A_[1],B_[1])));
      if(S.set.mode === 'balance'){
        var l = [lv(A_[0]), lv(A_[1]), lv(B_[0]), lv(B_[1])];
        pair += 10*(3.6*Math.abs(l[0]+l[1]-l[2]-l[3]) + 0.6*(Math.max.apply(null,l) - Math.min.apply(null,l)));
      }
      var total = fair + pair + Math.random()*0.5;
      if(total < bestScore){ bestScore = total; best = [A_.slice(), B_.slice()]; }
    });
  };
  var walk = function(idx, left, chosen){
    if(left === 0){ evalSet(chosen); return; }
    for(var i=idx;i<items.length;i++){
      if(items[i].size <= left){ chosen.push(items[i]); walk(i+1, left-items[i].size, chosen); chosen.pop(); }
    }
  };
  walk(0, 4, []);
  if(!best){ // ไม่มีชุดที่ลงตัว (เช่น ล็อกไม่ตรงจำนวน): ข้ามการล็อก
    var f = shuffle(cand.map(function(p){ return p.id; }).slice(0,4));
    best = [[f[0],f[1]], [f[2],f[3]]];
  }
  var no = S.games.reduce(function(m,g){ return Math.max(m, g.no || 0); }, 0) + 1;
  return {game:{id:uid(), no:no, cid:cid, a:best[0].slice(), b:best[1].slice(), t0:nowMs(), t1:null, done:false, fin:0}};
}

function costCalc(){
  var st = stats();
  var parts = S.players.filter(function(p){ return p.in || st.g[p.id] > 0; });
  var court = S.courts.reduce(function(s,c){ return s + courtCost(c); }, 0);
  var other = S.expenses.reduce(function(s,e){ return s + num(e.qty)*num(e.price); }, 0);
  var total = court + other, n = parts.length;
  var G = parts.reduce(function(s,p){ return s + st.g[p.id]; }, 0);
  var step = +S.set.round;
  var up = function(x){ return step === 0 ? Math.round(x*100)/100 : Math.ceil(x/step - 1e-9)*step; };
  var rows = parts.map(function(p){
    var g = st.g[p.id], raw = 0;
    if(n){
      if(S.set.cost === 'equal') raw = total/n;
      else if(S.set.cost === 'games') raw = G ? total*g/G : total/n;
      else raw = court/n + (G ? other*g/G : other/n);
    }
    return {p:p, g:g, raw:raw, amt:up(raw)};
  });
  var collected = rows.reduce(function(s,r){ return s + r.amt; }, 0);
  var paid = rows.reduce(function(s,r){ return s + (r.p.paid ? r.amt : 0); }, 0);
  return {rows:rows, court:court, other:other, total:total, n:n, collected:collected, paid:paid};
}

function archive(){
  try{
    var i = S.history.findIndex(function(e){ return e.sid === S.sid; });
    var meaningful = doneGames().length > 0 || S.players.some(function(p){ return p.in; });
    if(!meaningful){ if(i > -1) S.history.splice(i, 1); return; }
    var k = costCalc(), rs = resultStats(), nm = function(id){ var p = P(id); return p ? p.name : '?'; };
    var entry = {
      sid:S.sid, date:S.date, title:S.title, venue:S.venue, t:Date.now(),
      total:k.total, court:k.court, other:k.other, mode:S.set.cost,
      players:k.rows.map(function(r){ var q = rs[r.p.id] || {}; return {pid:r.p.id, name:r.p.name, level:r.p.level, g:r.g, amt:r.amt, paid:!!r.p.paid, w:q.w || 0, d:q.d || 0, l:q.l || 0, n:q.n || 0, e:Math.round((q.e || 0)*1000)/1000}; }),
      games:doneGames().map(function(g){ var c = C(g.cid); return {no:g.no, court:c ? c.name : 'คอร์ท', a:g.a.map(nm), b:g.b.map(nm), t0:g.t0||0, t1:g.t1||0, res:g.res, pA:g.pA}; })
    };
    if(i > -1) S.history[i] = entry; else S.history.push(entry);
  }catch(e){}
}

function shortDate(iso){
  if(!iso) return '';
  try{ var a = iso.split('-').map(Number); return new Date(a[0], a[1]-1, a[2]).toLocaleDateString('th-TH', {day:'numeric', month:'short', year:'2-digit'}); }
  catch(e){ return iso; }
}

function peopleAgg(){
  var m = {};
  S.history.slice().sort(function(a,b){ return a.date < b.date ? -1 : a.date > b.date ? 1 : (a.t||0)-(b.t||0); }).forEach(function(e){
    e.players.forEach(function(x){
      var o = m[x.pid] || (m[x.pid] = {pid:x.pid, name:x.name, n:0, g:0, amt:0, owed:0, last:''});
      o.name = x.name; o.n++; o.g += x.g; o.amt += x.amt;
      if(!x.paid) o.owed += x.amt;
      if(e.date > o.last) o.last = e.date;
    });
  });
  return Object.keys(m).map(function(k){ var o = m[k], cp = P(o.pid); if(cp) o.name = cp.name; return o; });
}

function prevDebt(){
  var m = {};
  S.history.forEach(function(e){
    if(e.sid === S.sid) return;
    e.players.forEach(function(x){ if(!x.paid && x.amt > 0) m[x.pid] = (m[x.pid]||0) + x.amt; });
  });
  return m;
}

function backupText(){ return JSON.stringify({app:'kuaa-tee-mua', exportedAt:new Date().toISOString(), state:S}); }

function parseBackup(text){
  var o = JSON.parse(text);
  if(o && o.state) o = o.state;
  if(o && typeof o === 'object') migrate(o);
  if(!o || o.v !== 1 || !Array.isArray(o.players) || !Array.isArray(o.courts)) throw new Error('bad');
  var d = defaultState();
  o.set = Object.assign(d.set, o.set || {});
  o = Object.assign(d, o);
  if(!Array.isArray(o.history)) o.history = [];
  if(!Array.isArray(o.locks)) o.locks = [];
  if(!o.sid) o.sid = uid();
  return o;
}

function tryPending(text){
  try{ pendingRestore = parseBackup(text); confirmKey = null; }
  catch(e){ pendingRestore = null; toast('ไม่ใช่ข้อมูลสำรองของแอปนี้ หรือข้อมูลเสียหาย'); }
  render();
}

function download(name, text){
  try{
    var b = new Blob([text], {type:'application/json'}), u = URL.createObjectURL(b), a = document.createElement('a');
    a.href = u; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(u); }, 2000);
    return true;
  }catch(e){ return false; }
}

function summaryText(){

  S.expenses.forEach(function(e){ var v = num(e.qty)*num(e.price); if(v>0) L.push(e.name+'  '+fmt(v)+' ฿'); });

/* ปุ่มที่ต้องกดซ้ำเพื่อยืนยัน (ใช้แทน confirm() ที่ถูกบล็อกในหน้าที่ฝังอยู่) */
function ask(key, fn){
  if(confirmKey === key){ confirmKey = null; clearTimeout(confirmTimer); fn(); return; }
  confirmKey = key; render();
  clearTimeout(confirmTimer);
  confirmTimer = setTimeout(function(){
    if(confirmKey !== key) return;
    confirmKey = null;
    var a = document.activeElement;
    if(!a || !/INPUT|TEXTAREA|SELECT/.test(a.tagName)) render();
  }, 3500);
}

/* ---------- actions ---------- */
function addOrTick(name, lv){
  var ex = S.players.find(function(p){ return p.name.trim().toLowerCase() === name.toLowerCase(); });
  if(ex){ if(!ex.in){ ex.in = true; joinLate(ex); } return false; }
  var p = {id:uid(), name:name, level:lv, lvBy:'m', in:true, rest:false, paid:false, base:0};
  S.players.push(p); joinLate(p); return true;
}
function swapIn(x, y){
  var X = locate(x), Y = locate(y), pool = poolPlayers().map(function(p){ return p.id; });
  if(X && Y){ X.arr[X.i] = y; Y.arr[Y.i] = x; return true; }
  if(X && !Y && pool.indexOf(y) > -1){ X.arr[X.i] = y; return true; }
  if(!X && Y && pool.indexOf(x) > -1){ Y.arr[Y.i] = x; return true; }
  return false;
}
function startCourt(cid, avoid){
  var c = C(cid); if(!c || gameOnCourt(cid)) return false;
  var res = buildGame(cid, avoid);
  if(res.err){ toast(res.err); return false; }
  S.games.push(res.game); return true;
}
function endGame(g){ g.done = true; g.t1 = nowMs(); S.fin = (S.fin || 0) + 1; g.fin = S.fin; g.pA = Math.round(winProb(g)*1000)/1000; }
function tickElapsed(){
  var els = document.querySelectorAll('.elapsed[data-t0]');
  for(var i=0;i<els.length;i++){
    var t0 = +els[i].getAttribute('data-t0'); if(!t0) continue;
    els[i].textContent = elapsedText({t0:t0});
  }
}
setInterval(tickElapsed, 20000);

      toast((had ? 'บันทึกครั้งก่อนลงประวัติแล้ว · ' : '')+'เริ่มก๊วนใหม่ ติ๊กลงชื่อคนที่มาวันนี้ได้เลย'); commit();
    });
  },
  wipe: function(){ ask('wipe', function(){ S = defaultState(); sel = null; commit(); }); },
  copy: function(){
    var t = summaryText(), ta = $('#sumtxt');
    var done = function(ok){ toast(ok ? 'คัดลอกแล้ว วางใน LINE ได้เลย' : 'คัดลอกอัตโนมัติไม่ได้ แตะค้างที่กล่องข้อความแล้วเลือกคัดลอกเอง'); if(!ok && ta){ ta.focus(); ta.select(); } };
    var fallback = function(){
      try{ if(ta){ ta.focus(); ta.select(); done(document.execCommand('copy')); } else done(false); }catch(e){ done(false); }
    };
    if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(t).then(function(){ done(true); }, fallback); }
    else fallback();
  }
};

function onField(el){
  var parts = el.dataset.f.split(':'), k = parts[0], f = parts[1], id = el.dataset.id;
  var val = el.type === 'checkbox' ? el.checked : (el.type === 'number' ? num(el.value) : el.value);
  if(k === 'p'){
    var p = P(id); if(!p) return;
    if(f === 'in'){ p.in = val; if(val) joinLate(p); }
    else if(f === 'name'){ var n = String(val).trim(); if(n) p.name = n.slice(0,30); }
    else if(f === 'level'){ setLevel(p.id, parseInt(val,10) || 5, 'm'); }
    else if(f === 'paid'){ p.paid = val; }
  }else if(k === 'c'){
    var c = C(id); if(!c) return;
    if(f === 'name'){ c.name = String(val).trim() || c.name; } else c[f] = val;
  }else if(k === 'e'){
    var e = S.expenses.find(function(x){ return x.id === id; }); if(!e) return;
    e[f] = val;
  }else if(k === 'o'){
    onOnlineField(f, val); return;
  }else if(k === 'h'){
    var pid = el.dataset.pid;
    if(id === S.sid){ var cp = P(pid); if(cp) cp.paid = val; }
    else{ var he = S.history.find(function(x){ return x.sid === id; }); var hx = he && he.players.find(function(q){ return q.pid === pid; }); if(hx) hx.paid = val; }
  }else if(k === 's'){
    S[f] = val;
  }else if(k === 'set'){
    S.set[f] = (f === 'round') ? parseInt(val,10) : val;
  }
  commit();
}

function b64u(s){ return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); }
function unb64u(s){ s = s.replace(/-/g,'+').replace(/_/g,'/'); while(s.length % 4) s += '='; return atob(s); }
/* คีย์แบบ JWT (eyJ…) ส่งทั้ง apikey และ Authorization ส่วนคีย์แบบใหม่ sb_publishable_… ส่งเฉพาะ apikey */
function keyHeaders(key){ var h = {'Content-Type':'application/json', apikey:key}; if(/^eyJ/.test(key)) h.Authorization = 'Bearer '+key; return h; }
function sb(cfg, fn, args){
  var base = String(cfg.url || '').replace(/\/+$/, '');
  return fetch(base+'/rest/v1/rpc/'+fn, {method:'POST', headers:keyHeaders(cfg.key), body:JSON.stringify(args || {})})
    .then(function(r){
      return r.json().catch(function(){ return null; }).then(function(j){
        if(!r.ok){ var e = new Error((j && j.message) || ('http_'+r.status)); e.code = (j && j.message) || ''; throw e; }
        return j;
      });
    });
}

function onOnlineField(f, val){
  if(f === 'cap'){ ON.cap = Math.min(300, Math.max(4, Math.round(+val || 60))); saveOn(); if(ON.linked) publishBoard(true).catch(function(){}); return; }
  ON[f] = String(val).trim(); if(f === 'code') ON.code = ON.code.toLowerCase(); saveOn();
}
function softRender(){
  var a = document.activeElement;
  if(a && /INPUT|TEXTAREA|SELECT/.test(a.tagName)){ pendingRender = true; return; }
  render();
}
document.addEventListener('focusout', function(){ if(pendingRender){ pendingRender = false; setTimeout(function(){ if(!PCODE) render(); }, 60); } });

function reconcileSignups(list){
  var changed = false;
  list.forEach(function(sg){
    var p = S.players.find(function(x){ return x.sid === sg.sid; });
    if(!p){
      if(sg.status !== 'in') return;
      var ex = S.players.find(function(x){ return !x.sid && x.name.trim().toLowerCase() === String(sg.name).trim().toLowerCase(); });
      if(ex){ ex.sid = sg.sid; ex.sver = sg.ver; if(!ex.in){ ex.in = true; joinLate(ex); } if(sg.level !== ex.level) ex.lvAsk = sg.level; changed = true; return; }
      p = {id:uid(), name:sg.name, level:sg.level, lvBy:'s', lvAt:todayISO(), in:true, rest:false, paid:false, base:0, sid:sg.sid, sver:sg.ver};
      S.players.push(p); joinLate(p); changed = true; return;
    }
    if(sg.ver > (p.sver || 0)){
      p.sver = sg.ver; changed = true;
      if(sg.name && sg.name !== p.name) p.name = sg.name;
      if(sg.level !== p.level){ if(p.lvBy === 'm') p.lvAsk = sg.level; else noteLevel(p, sg.level, 's'); }
      else delete p.lvAsk;
      if(sg.status === 'in' && !p.in){ p.in = true; joinLate(p); }
      else if(sg.status === 'out' && p.in){ p.in = false; }
    }
  });
  return changed;
}

function buildBoard(){
  var st = stats(), order = queueOrder();
  var nm = function(id){ var p = P(id); return p ? {n:p.name, s:p.sid || null, l:p.level} : {n:'?', s:null, l:3}; };
  return {
    v:1, title:S.title, date:S.date, venue:S.venue,
    courts:S.courts.filter(function(c){ return c.on || gameOnCourt(c.id); }).map(function(c){
      var g = gameOnCourt(c.id);
      return {id:c.id, ix:S.courts.indexOf(c), name:c.name, time:(c.start && c.end) ? c.start+'–'+c.end : '', on:!!c.on,
        game: g ? {no:g.no, t0:g.t0 || 0, a:g.a.map(nm), b:g.b.map(nm)} : null};
    }),
    queue:order.map(function(p){ return {n:p.name, s:p.sid || null, g:st.g[p.id] || 0}; }),
    rest:S.players.filter(function(p){ return p.in && p.rest; }).map(function(p){ return {n:p.name, s:p.sid || null}; }),
    done:doneGames().length, people:S.players.filter(function(p){ return p.in; }).length, top:ON.showTop ? topPerformers() : []
  };
}
function publishBoard(force){
  if(!ON.linked) return Promise.resolve();
  var b = buildBoard(), meta = JSON.stringify(b)+'|'+ON.open+'|'+ON.cap+'|'+S.title;
  if(!force && meta === lastPub.meta && Date.now() - lastPub.at < 30000) return Promise.resolve();
  b.t = Date.now();
  return sb(ON, 'kuaa_publish_board', {p_code:ON.code, p_admin_key:ON.adminKey, p_board:b, p_title:S.title, p_open:ON.open, p_capacity:ON.cap})
    .then(function(){ lastPub = {meta:meta, at:Date.now()}; onlineStatus.pubAt = Date.now(); });
}
function schedulePublish(){ clearTimeout(pubT); pubT = setTimeout(function(){ publishBoard(false).catch(function(e){ onlineStatus.ok = false; onlineStatus.err = errText(e); softRender(); }); }, 600); }

function teamText(g){
  var n = function(id){ var p = P(id); return p ? p.name : '?'; };
  return n(g.a[0])+' + '+n(g.a[1])+' พบ '+n(g.b[0])+' + '+n(g.b[1]);
}
/* เปรียบเทียบสถานะก่อน/หลัง: ใครเพิ่งได้ลงสนาม / เพิ่งเข้า 4 คิวถัดไป → ส่ง Web Push */
function notifyDiff(){
  if(!ON.linked || !ON.pushOn){ prevPlaying = prevNear = null; return; }
  var playing = {}, near = {};
  activeGames().forEach(function(g){ var c = C(g.cid); g.a.concat(g.b).forEach(function(id){ var p = P(id); if(p && p.sid) playing[p.sid] = {g:g, court:c ? c.name : 'คอร์ท'}; }); });
  queueOrder().slice(0,4).forEach(function(p,i){ if(p.sid) near[p.sid] = i+1; });
  if(prevPlaying === null){ prevPlaying = Object.keys(playing); prevNear = Object.keys(near); return; }
  var targets = [];
  Object.keys(playing).forEach(function(sid){
    if(prevPlaying.indexOf(sid) < 0){ var i = playing[sid]; targets.push({sid:sid, kind:'turn', tag:'turn', title:'ถึงคิวแล้ว! 🏸', body:'ลง '+i.court+' · เกมที่ '+i.g.no+' — '+teamText(i.g)}); }
  });
  Object.keys(near).forEach(function(sid){
    if(prevNear.indexOf(sid) < 0 && !playing[sid]) targets.push({sid:sid, kind:'near', tag:'near', title:'ใกล้ถึงคิวแล้ว ⏳', body:'เตรียมตัวได้เลย ตอนนี้คุณเป็นคิวที่ '+near[sid]});
  });
  prevPlaying = Object.keys(playing); prevNear = Object.keys(near);
  if(targets.length) sendPush(targets);
}
function sendPush(targets){
  var link = inviteLink();
  targets.forEach(function(t){ t.url = link; });
  fetch(String(ON.url).replace(/\/+$/,'')+'/functions/v1/notify', {method:'POST', headers:keyHeaders(ON.key),
    body:JSON.stringify({code:ON.code, adminKey:ON.adminKey, targets:targets})})
    .then(function(r){ return r.json(); }).then(function(j){ onlineStatus.push = j; }).catch(function(){ onlineStatus.push = {error:true}; });
}
function onSaved(){
  if(typeof ON === 'undefined' || !ON || !ON.linked || PCODE) return;
  notifyDiff(); schedulePublish();
}
function syncNow(){
  if(!ON.linked || syncBusy) return Promise.resolve();
  syncBusy = true;
  return sb(ON, 'kuaa_list_signups', {p_code:ON.code, p_admin_key:ON.adminKey}).then(function(list){
    var changed = reconcileSignups(list), was = onlineStatus.ok;
    onlineStatus.ok = true; onlineStatus.at = Date.now(); onlineStatus.err = '';
    onlineStatus.count = list.filter(function(x){ return x.status === 'in'; }).length;
    if(changed){ save(); softRender(); } else if(S.tab === 'players' && (was !== true)) softRender();
    return publishBoard(false);
  }).catch(function(e){ onlineStatus.ok = false; onlineStatus.err = errText(e); if(S.tab === 'players') softRender(); })
    .then(function(){ syncBusy = false; });
}
function startOnline(){
  clearInterval(syncTimer);
  if(ON.linked){ syncNow(); syncTimer = setInterval(syncNow, 6000); }
}
function linkOnline(){ ON.linked = true; saveOn(); prevPlaying = prevNear = null; lastPub = {meta:'', at:0}; onlineStatus = {ok:null, at:0, err:'', count:0, pubAt:0, push:null}; startOnline(); render(); }
function needCfg(){
  if(!ON.url || !ON.key){ onlineStatus.err = 'กรอก Project URL และ anon key ก่อน'; render(); return true; }
  if(!ON.code || !ON.adminKey){ onlineStatus.err = 'กรอกโค้ดก๊วนและรหัสผู้จัดการก่อน'; render(); return true; }
  return false;

var PS = {code:'', cfg:null, me:null, meInfo:null, data:null, err:'', loaded:false, banner:null, prev:null, soundOn:false, audio:null, notifMsg:'', swReg:null, lastMe:0, pendingP:false};
var PKEY = 'kuaa-cfg', PME = function(code){ return 'kuaa-me-'+code; };
function isStandalone(){ return window.navigator.standalone === true || (window.matchMedia && matchMedia('(display-mode: standalone)').matches); }
function playerRoute(){
  var m = /[#&?]j=([a-z0-9-]{4,24})/.exec(location.hash + location.search);
  if(m) return m[1];
  var hasMgr = false; try{ hasMgr = !!localStorage.getItem(KEY); }catch(e){}
  if(isStandalone() && !hasMgr){ try{ var last = localStorage.getItem('kuaa-last-j'); if(last) return last; }catch(e){} }
  return null;
}
var PCODE = playerRoute();
function pLoadCfg(){
  var m = /[#&]c=([A-Za-z0-9_-]+)/.exec(location.hash), cfg = null;
  if(m){ try{ var o = JSON.parse(unb64u(m[1])); cfg = {url:o.u, key:o.k, vapid:o.v || ''}; localStorage.setItem(PKEY, JSON.stringify(cfg)); }catch(e){} }
  if(!cfg && CFG.url && CFG.key) cfg = {url:CFG.url, key:CFG.key, vapid:CFG.vapid || ''};
  if(!cfg){ try{ cfg = JSON.parse(localStorage.getItem(PKEY) || 'null'); }catch(e){} }
  if(cfg && CFG.vapid && !cfg.vapid) cfg.vapid = CFG.vapid;
  return cfg;
}
function rnd24(){ var a = new Uint8Array(24); crypto.getRandomValues(a); return Array.prototype.map.call(a, function(x){ return ('0'+x.toString(16)).slice(-2); }).join(''); }
function urlB64ToU8(s){ s = s.replace(/-/g,'+').replace(/_/g,'/'); while(s.length % 4) s += '='; var r = atob(s), o = new Uint8Array(r.length); for(var i=0;i<r.length;i++) o[i] = r.charCodeAt(i); return o; }

function initPlayer(code){
  PS.code = code; PS.cfg = pLoadCfg();
  document.body.classList.add('player');
  try{ localStorage.setItem('kuaa-last-j', code); }catch(e){}
  try{ PS.me = JSON.parse(localStorage.getItem(PME(code)) || 'null'); }catch(e){ PS.me = null; }
  try{ PS.soundOn = localStorage.getItem('kuaa-sound') === '1'; }catch(e){}
  if(!PS.cfg){ PS.err = 'ลิงก์นี้ไม่มีข้อมูลการเชื่อมต่อ ขอลิงก์ใหม่จากผู้จัดการนะ'; PS.loaded = true; pRender(); return; }
  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('sw.js').then(function(r){ PS.swReg = r; }).catch(function(){});
    navigator.serviceWorker.addEventListener('message', function(ev){ if(ev.data && ev.data.type === 'push') pPoll(); });
  }
  document.addEventListener('visibilitychange', function(){ if(!document.hidden){ pPoll(); if(PS.titleBackup){ document.title = PS.titleBackup; PS.titleBackup = null; } } });
  pRender(); pPoll(); setInterval(pPoll, 5000);
}
function pAlertAllowed(){ return typeof Notification !== 'undefined' && Notification.permission === 'granted'; }
function myState(){
  var b = PS.data && PS.data.board; if(!PS.me || !b || !b.courts) return null;
  if(PS.meInfo && PS.meInfo.status === 'out') return {k:'out'};
  var sid = PS.me.sid, i, c;
  for(i=0;i<b.courts.length;i++){ c = b.courts[i]; if(c.game && c.game.a.concat(c.game.b).some(function(x){ return x.s === sid; })) return {k:'play', court:c.name, game:c.game}; }
  var qi = (b.queue || []).findIndex(function(x){ return x.s === sid; });
  if(qi > -1) return {k:'queue', pos:qi+1, total:b.queue.length, near:qi < 4};
  if((b.rest || []).some(function(x){ return x.s === sid; })) return {k:'rest'};
  return {k:'wait'};
}
function pPoll(){
  if(!PS.cfg) return;
  var tasks = [sb(PS.cfg, 'kuaa_get_board', {p_code:PS.code}).then(function(d){ PS.data = d; PS.err = ''; })];
  if(PS.me && (Date.now() - PS.lastMe > 15000 || !PS.meInfo)){
    PS.lastMe = Date.now();
    tasks.push(sb(PS.cfg, 'kuaa_me', {p_sid:PS.me.sid, p_secret:PS.me.secret}).then(function(m){ PS.meInfo = m; }).catch(function(e){ if(e.code === 'forbidden'){ PS.me = null; PS.meInfo = null; try{ localStorage.removeItem(PME(PS.code)); }catch(_){} } }));
  }
  return Promise.all(tasks).then(function(){ PS.loaded = true; pCheckAlerts(); pRender(); })
    .catch(function(e){ PS.err = errText(e); PS.loaded = true; pRender(); });
}
function pCheckAlerts(){
  var cur = myState(); if(!cur) return;
  var prev = PS.prev; PS.prev = cur;
  if(!prev) return;
  if(cur.k === 'play' && (prev.k !== 'play' || prev.game.no !== cur.game.no)){
    var g = cur.game, nm = function(x){ return x.n; };
    pAlert('turn', 'ถึงคิวแล้ว! 🏸', 'ลง '+cur.court+' · เกมที่ '+g.no+' — '+g.a.map(nm).join(' + ')+' พบ '+g.b.map(nm).join(' + '));
  }else if(cur.k === 'queue' && cur.near && !(prev.k === 'queue' && prev.near)){
    pAlert('near', 'ใกล้ถึงคิวแล้ว ⏳', 'เตรียมตัวได้เลย ตอนนี้คุณเป็นคิวที่ '+cur.pos);
  }else if(cur.k !== 'play' && PS.banner && PS.banner.kind === 'turn' && prev.k === 'play'){
    PS.banner = null;
  }
}
function pAlert(kind, title, body){
  PS.banner = {kind:kind, title:title, body:body};
  if(PS.soundOn) beep(kind === 'turn' ? 3 : 2);
  try{ if(navigator.vibrate) navigator.vibrate(kind === 'turn' ? [300,120,300,120,500] : [200,100,200]); }catch(e){}
  if(document.hidden){
    if(!PS.titleBackup) PS.titleBackup = document.title; document.title = '🔔 '+title;
    if(pAlertAllowed() && PS.swReg && PS.swReg.showNotification){
      PS.swReg.showNotification(title, {body:body, tag:kind, renotify:true, icon:'icon-192.png', data:{url:location.href}, vibrate:[300,120,300]});
    }
  }
}
function beep(n){
  var c = PS.audio; if(!c) return;
  try{
    if(c.resume) c.resume();
    for(var i=0;i<n;i++){
      var o = c.createOscillator(), g = c.createGain(), t = c.currentTime + i*0.3;
      o.type = 'sine'; o.frequency.value = i % 2 ? 880 : 1046; o.connect(g); g.connect(c.destination);
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.35, t+0.03); g.gain.exponentialRampToValueAtTime(0.0001, t+0.26);
      o.start(t); o.stop(t+0.28);
    }
  }catch(e){}
}

A.lvNoteOk = function(){ S.lvMigrated = false; commit(); };
A.lvConfirm = function(id){ var p = P(id); if(p){ p.lvBy = 'm'; commit(); } };
A.lvAccept = function(id){ var p = P(id); if(p && p.lvAsk){ setLevel(id, p.lvAsk, 'm'); toast('ปรับเลเวลของ '+p.name+' เป็น Lv '+p.level+' แล้ว'); commit(); } };
A.lvDecline = function(id){ var p = P(id); if(p){ delete p.lvAsk; if(typeof ON !== 'undefined' && ON && ON.linked && p.sid) sb(ON, 'kuaa_admin_set_level', {p_code:ON.code, p_admin_key:ON.adminKey, p_sid:p.sid, p_level:p.level}).catch(function(){}); commit(); } };
document.body.insertAdjacentHTML('beforeend', '<div id="lvsheet" class="lvsheet" hidden role="dialog" aria-modal="true" aria-label="คู่มือเลือกเลเวล"><div class="lvback" data-act="lvClose"></div><div class="lvpanel"></div></div>');
document.addEventListener('keydown', function(ev){ if(ev.key === 'Escape' && LG.open) A.lvClose(); });

/* =====================================================================
   ผลแพ้ชนะ: ลงผลแตะเดียวหลังจบเกม / สรุปผลแบบไม่ทำให้ใครอาย / ข้อมูลประกอบการปรับเลเวล
   ===================================================================== */
var histRes = {scope:'today', full:false};
function winProb(g){
  var lv = function(id){ var p = P(id); return p ? p.level : 5; };
  var d = (lv(g.a[0]) + lv(g.a[1]))/2 - (lv(g.b[0]) + lv(g.b[1]))/2;
  return 1/(1 + Math.exp(-0.6*d));
}
function resText(r){ return r === 'A' ? 'ทีม A ชนะ' : r === 'B' ? 'ทีม B ชนะ' : r === 'D' ? 'เสมอ' : r === null ? 'ไม่ได้ลงผล' : 'ยังไม่ลงผล'; }
function hasRes(g){ return g.res === 'A' || g.res === 'B' || g.res === 'D'; }
function pendingRes(){
  if(S.set.askRes === false) return [];
  return doneGames().filter(function(g){ return g.pA !== undefined && g.res === undefined; });
}
function resultStats(){
  var m = {};
  doneGames().forEach(function(g){
    if(!hasRes(g)) return;
    var pa = g.pA === undefined ? 0.5 : g.pA;
    [[g.a, 'A', pa], [g.b, 'B', 1 - pa]].forEach(function(t){
      t[0].forEach(function(id){
        var o = m[id] || (m[id] = {w:0, d:0, l:0, n:0, e:0});
        o.n++; o.e += t[2];
        if(g.res === 'D') o.d++; else if(g.res === t[1]) o.w++; else o.l++;
      });
    });
  });
  return m;
}
function cumAgg(){
  var m = {};
  S.history.forEach(function(e){
    e.players.forEach(function(x){
      if(!x.n) return;
      var o = m[x.pid] || (m[x.pid] = {pid:x.pid, name:x.name, w:0, d:0, l:0, n:0, e:0});
      o.name = x.name; o.w += x.w || 0; o.d += x.d || 0; o.l += x.l || 0; o.n += x.n || 0; o.e += x.e || 0;
    });
  });
  return m;
}
function fmtDelta(x){ var d = Math.round(x*10)/10; return d === 0 ? '0.0' : (d > 0 ? '+' : '−')+Math.abs(d).toFixed(1); }
function rowStats(o){ var score = o.w + 0.5*o.d; return {score:score, pct:o.n ? Math.round(100*score/o.n) : null, delta:score - o.e}; }
function lvHintOf(o){ if(!o || o.n < 10) return 0; var r = rowStats(o).delta / o.n; return r >= 0.15 ? 1 : r <= -0.15 ? -1 : 0; }
function resultRows(scope){
  var rows = [];
  if(scope === 'today'){
    var rs = resultStats();
    Object.keys(rs).forEach(function(id){ var p = P(id), o = rs[id]; rows.push({pid:id, name:p ? p.name : '?', w:o.w, d:o.d, l:o.l, n:o.n, e:o.e}); });
  }else{
    var ca = cumAgg();
    Object.keys(ca).forEach(function(id){ var p = P(id), o = ca[id]; rows.push({pid:id, name:p ? p.name : o.name, w:o.w, d:o.d, l:o.l, n:o.n, e:o.e}); });
  }
  rows.forEach(function(r){ var s = rowStats(r); r.score = s.score; r.pct = s.pct; r.delta = s.delta; });
  return rows;
}
function topPerformers(){
  return resultRows('today').filter(function(r){ return r.n >= 3 && r.score/r.n >= 0.5; })
    .sort(function(a,b){ return (b.score/b.n - a.score/a.n) || (b.n - a.n); }).slice(0,3)
    .map(function(r){ return {n:r.name, w:r.w, g:r.n}; });
}
function resBar(){
  if(S.tab !== 'match') return '';
  var pend = pendingRes(); if(!pend.length) return '';
  var g = pend[0], c = C(g.cid), nm = function(i){ var p = P(i); return p ? esc(p.name) : '?'; };
  var btn = function(v, cls, t){ return '<button class="'+cls+'" data-act="resPick" data-id="'+g.id+'" data-v="'+v+'">'+t+'</button>'; };
  return '<div class="resbar"><div class="rmsg"><b>เกมที่ '+g.no+'</b> · '+esc(c ? c.name : 'คอร์ท')+' — ใครชนะ?<small>'+nm(g.a[0])+' + '+nm(g.a[1])+' <i>พบ</i> '+nm(g.b[0])+' + '+nm(g.b[1])+(pend.length > 1 ? ' · เหลืออีก '+(pend.length-1)+' เกม' : '')+'</small></div>'+
    '<div class="rbtns">'+btn('A','ra','ทีม A ชนะ')+btn('D','rd','เสมอ')+btn('B','rb','ทีม B ชนะ')+btn('N','rn','ข้าม')+'</div></div>';
}
function gameResRow(g){
  var c = C(g.cid), nm = function(i){ var p = P(i); return p ? esc(p.name) : '?'; };
  var dur = g.t0 && g.t1 && g.t1 > g.t0 + 1000 ? ' · '+Math.max(1,Math.round((g.t1-g.t0)/60000))+' นาที' : '';
  var chip = function(v, t, cls){ return '<button class="rc '+cls+(g.res === v ? ' on' : '')+'" data-act="resPick" data-id="'+g.id+'" data-v="'+v+'">'+t+'</button>'; };
  return '<div class="grow"><div class="gl"><b>เกมที่ '+g.no+'</b><small>'+(c ? esc(c.name) : 'คอร์ท')+dur+(g.edited ? ' · แก้ไขแล้ว' : '')+'</small>'+
    '<div>'+nm(g.a[0])+' + '+nm(g.a[1])+' <i>พบ</i> '+nm(g.b[0])+' + '+nm(g.b[1])+'</div></div>'+
    '<div class="rch">'+chip('A','A ชนะ','a')+chip('D','เสมอ','d')+chip('B','B ชนะ','b')+'</div></div>';
}
function resultsCard(){
  var today = histRes.scope === 'today', rows = resultRows(histRes.scope);
  var ranked = rows.filter(function(r){ return r.n >= 3; }).sort(function(a,b){ return (b.score/b.n - a.score/a.n) || (b.n - a.n); });
  var best = ranked.filter(function(r){ return r.score/r.n >= 0.5; }).slice(0,3);
  var h = '<div class="card"><h2>ผลการเล่น</h2><div class="seg" style="margin-bottom:10px"><button class="'+(today?'on':'')+'" data-act="hlScope" data-id="today">วันนี้</button><button class="'+(!today?'on':'')+'" data-act="hlScope" data-id="all">สะสมทุกครั้ง</button></div>';
  if(!rows.length){
    return h + '<p class="hint">ยังไม่มีผลที่ลงไว้ กดลงผลหลังจบเกมได้ที่แท็บจับคู่ (ข้ามได้ ไม่บังคับ)</p></div>';
  }
  if(best.length){
    var m = best[0];
    h += '<div class="mvp"><div class="mvpi">🏆</div><div><small>MVP · ชนะบ่อยที่สุด'+(today ? 'วันนี้' : 'สะสม')+'</small><b>'+esc(m.name)+'</b><span>ชนะ '+m.w+' เสมอ '+m.d+' แพ้ '+m.l+' จาก '+m.n+' เกม ('+m.pct+'%)</span></div></div>';
    if(best.length > 1) h += '<div class="stars">'+best.slice(1).map(function(r){ return '<span>⭐ '+esc(r.name)+' <small>'+r.pct+'% จาก '+r.n+' เกม</small></span>'; }).join('')+'</div>';
  }else{
    h += '<p class="hint">ยังมีผลไม่พอจะสรุปดาวเด่น (ต้องมีอย่างน้อย 3 เกมต่อคน)</p>';
  }
  h += '<p class="hint">ตารางเต็มซ่อนไว้เป็นค่าเริ่มต้นเพื่อไม่ให้เกิดการเปรียบเทียบกันในก๊วน ผู้จัดการกดดูได้เมื่อต้องใช้ประกอบการตัดสินใจเรื่องเลเวล</p>'+
    '<div class="btnrow"><button class="btn sm ghost" data-act="hlFull">'+(histRes.full ? 'ซ่อนตารางเต็ม' : '👁️ ดูตารางเต็ม (ผู้จัดการ)')+'</button></div>';
  if(histRes.full){
    var all = rows.slice().sort(function(a,b){ return (b.n >= 3) - (a.n >= 3) || ((b.n ? b.score/b.n : 0) - (a.n ? a.score/a.n : 0)) || (b.n - a.n); });
    h += '<div class="rtab"><div class="rth"><span>ชื่อ</span><span>เกม</span><span>ชนะ</span><span>เสมอ</span><span>แพ้</span><span>%ชนะ</span><span>เทียบที่คาด</span></div>'+
      all.map(function(r){
        var ok = r.n >= 3;
        return '<div class="rtr"><span>'+esc(r.name)+'</span><span>'+r.n+'</span><span>'+r.w+'</span><span>'+r.d+'</span><span>'+r.l+'</span><span>'+(ok ? r.pct+'%' : '–')+'</span><span>'+(ok ? fmtDelta(r.delta) : '–')+'</span></div>';
      }).join('')+'</div>'+
      '<p class="hint">% ชนะนับเสมอเป็นครึ่งชนะ · “เทียบที่คาด” = ผลจริงลบผลที่ควรได้ตามเลเวลของสองฝั่ง (บวก = ดีกว่าคาด) หน่วยเป็นเกม · แสดงเมื่อมีผลอย่างน้อย 3 เกม · ผลขึ้นกับคู่หูและคู่ต่อสู้ด้วย ใช้เป็นข้อมูลประกอบเท่านั้น</p>';
  }
  return h + '</div>';
}
function evidenceHTML(pid){
  var o = cumAgg()[pid]; if(!o || !o.n) return '';
  var s = rowStats(o), exp = Math.round(100*o.e/o.n), msg;
  if(o.n < 10) msg = 'ข้อมูลยังน้อย (ต่ำกว่า 10 เกม) ดูเป็นแนวโน้มเท่านั้น';
  else{ var h = lvHintOf(o); msg = h > 0 ? 'ผลดีกว่าที่คาดต่อเนื่อง อาจพิจารณาขยับเลเวลขึ้น' : h < 0 ? 'ผลต่ำกว่าที่คาด ลองตรวจดูว่าเลเวลยังเหมาะไหม (ดูฟอร์มและคู่หูประกอบด้วย)' : 'ผลใกล้เคียงที่คาด เลเวลน่าจะตรงแล้ว'; }
  return '<div class="lvev"><b>📊 ข้อมูลผลการเล่น</b><span>มีผล '+o.n+' เกม · ชนะ '+o.w+' เสมอ '+o.d+' แพ้ '+o.l+' ('+s.pct+'%) · ที่คาดไว้ตามเลเวล '+exp+'%</span><small>'+msg+' · ผลขึ้นกับคู่หูและคู่ต่อสู้ด้วย</small></div>';
}
A.resPick = function(id, el){
  var g = S.games.find(function(x){ return x.id === id; }); if(!g) return;
  var v = el.dataset.v, nv = v === 'N' ? null : v;
  if(g.res !== undefined && g.res !== null && g.res !== nv) g.edited = true;
  g.res = nv; commit();
};
A.toggleAsk = function(){ S.set.askRes = S.set.askRes === false; commit(); };
A.hlScope = function(id){ histRes.scope = id; render(); };
A.hlFull = function(){ histRes.full = !histRes.full; render(); };
A.onTop = function(){ ON.showTop = !ON.showTop; saveOn(); publishBoard(true).catch(function(){}); render(); };

if(PCODE){ initPlayer(PCODE); } else { render(); startOnline(); }
})();
</script>
